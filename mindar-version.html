<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BurgerVision Mind AR</title>
    <!-- Mind AR - Alternative gratuite à 8th Wall -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Menu principal -->
    <div id="menu-container" class="container">
        <header>
            <h1>🍔 BurgerVision Mind AR</h1>
            <p>AR gratuit avec reconnaissance d'images</p>
            <div class="ar-instructions">
                <p>📱 Imprimez les marqueurs ci-dessous pour voir les burgers en AR</p>
            </div>
        </header>

        <!-- Marqueurs à imprimer -->
        <div class="markers-section">
            <h3>🎯 Marqueurs AR (à imprimer)</h3>
            <div class="markers-grid">
                <div class="marker-card">
                    <canvas id="marker-classic" width="150" height="150"></canvas>
                    <p>Classic Burger</p>
                </div>
                <div class="marker-card">
                    <canvas id="marker-cheese" width="150" height="150"></canvas>
                    <p>Cheese Deluxe</p>
                </div>
                <div class="marker-card">
                    <canvas id="marker-bacon" width="150" height="150"></canvas>
                    <p>Bacon Supreme</p>
                </div>
            </div>
        </div>

        <button id="start-mind-ar" class="ar-btn-large" onclick="startMindAR()">
            🚀 Démarrer Mind AR
        </button>
    </div>

    <!-- Scène Mind AR -->
    <a-scene 
        id="mindar-scene"
        mindar-image="imageTargetSrc: targets.mind; maxTrack: 3"
        color-space="sRGB" 
        renderer="colorManagement: true; physicallyCorrectLights: true"
        embedded 
        style="display: none;">
        
        <a-assets>
            <!-- Matériaux réalistes -->
            <a-mixin id="mind-burger-base"
                animation="property: rotation; to: 0 360 0; dur: 15000; loop: true; easing: linear">
            </a-mixin>
            
            <a-mixin id="mind-appear"
                animation="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; easing: easeOutElastic; startEvents: targetFound">
            </a-mixin>
        </a-assets>

        <!-- Caméra -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Éclairage -->
        <a-light type="ambient" color="#404040" intensity="0.4"></a-light>
        <a-light type="directional" position="0 0 0" color="#ffffff" intensity="1"></a-light>

        <!-- Target 0: Classic Burger -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-entity id="mind-burger-classic" mixin="mind-burger-base mind-appear" position="0 0 0" scale="0.5 0.5 0.5">
                <!-- Burger Classic complet -->
                <a-cylinder radius="0.6" height="0.15" color="#D2691E" position="0 0 0"></a-cylinder>
                <a-cylinder radius="0.5" height="0.04" color="#32CD32" position="0 0.1 0"></a-cylinder>
                <a-cylinder radius="0.55" height="0.12" color="#8B4513" position="0 0.16 0"></a-cylinder>
                <a-cylinder radius="0.4" height="0.04" color="#FF6347" position="0 0.24 0"></a-cylinder>
                <a-sphere radius="0.6" scale="1 0.7 1" color="#DEB887" position="0 0.4 0"></a-sphere>
                
                <!-- Prix 3D -->
                <a-text value="🍔 Classic\n8.90€" position="0 0.8 0" align="center" 
                       color="#FFFFFF" scale="2 2 2" look-at="[camera]"></a-text>
            </a-entity>
        </a-entity>

        <!-- Target 1: Cheese Burger -->
        <a-entity mindar-image-target="targetIndex: 1">
            <a-entity id="mind-burger-cheese" mixin="mind-burger-base mind-appear" position="0 0 0" scale="0.5 0.5 0.5">
                <a-cylinder radius="0.6" height="0.15" color="#D2691E" position="0 0 0"></a-cylinder>
                <a-cylinder radius="0.5" height="0.04" color="#32CD32" position="0 0.1 0"></a-cylinder>
                <a-cylinder radius="0.55" height="0.12" color="#8B4513" position="0 0.16 0"></a-cylinder>
                <a-cylinder radius="0.65" height="0.06" color="#FFD700" position="0 0.24 0"></a-cylinder>
                <a-sphere radius="0.6" scale="1 0.7 1" color="#DEB887" position="0 0.44 0"></a-sphere>
                
                <a-text value="🧀 Cheese\n9.90€" position="0 0.8 0" align="center" 
                       color="#FFFFFF" scale="2 2 2" look-at="[camera]"></a-text>
            </a-entity>
        </a-entity>

        <!-- Target 2: Bacon Burger -->
        <a-entity mindar-image-target="targetIndex: 2">
            <a-entity id="mind-burger-bacon" mixin="mind-burger-base mind-appear" position="0 0 0" scale="0.5 0.5 0.5">
                <a-cylinder radius="0.6" height="0.15" color="#D2691E" position="0 0 0"></a-cylinder>
                <a-cylinder radius="0.5" height="0.04" color="#32CD32" position="0 0.1 0"></a-cylinder>
                <a-cylinder radius="0.55" height="0.12" color="#8B4513" position="0 0.16 0"></a-cylinder>
                <!-- Bacon ondulé -->
                <a-box width="1" height="0.04" depth="0.2" color="#DC143C" position="0.2 0.26 0" rotation="0 0 20"></a-box>
                <a-box width="1" height="0.04" depth="0.2" color="#DC143C" position="-0.2 0.26 0" rotation="0 0 -20"></a-box>
                <a-cylinder radius="0.65" height="0.06" color="#FFD700" position="0 0.3 0"></a-cylinder>
                <a-sphere radius="0.6" scale="1 0.7 1" color="#DEB887" position="0 0.5 0"></a-sphere>
                
                <a-text value="🥓 Bacon\n11.90€" position="0 0.8 0" align="center" 
                       color="#FFFFFF" scale="2 2 2" look-at="[camera]"></a-text>
            </a-entity>
        </a-entity>
    </a-scene>

    <!-- Overlay instructions -->
    <div id="mindar-overlay" style="display: none; position: fixed; top: 20px; left: 20px; right: 20px; z-index: 1000;">
        <div style="background: rgba(0,0,0,0.8); color: white; padding: 15px; border-radius: 10px; text-align: center;">
            <p id="mindar-status">📱 Pointez vers un marqueur imprimé</p>
            <button onclick="exitMindAR()" style="background: #FF6B35; color: white; border: none; padding: 10px 20px; border-radius: 5px; margin-top: 10px;">
                ❌ Fermer
            </button>
        </div>
    </div>

    <script src="mindar-script.js"></script>
</body>
</html>
