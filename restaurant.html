<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Court AR - Restaurant Moderne</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #FFD700;
        }

        .main-content {
            margin-top: 100px;
            padding: 2rem;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 3rem;
            color: white;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .hero-subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .food-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .food-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
        }

        .food-image {
            width: 100%;
            height: 200px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 1rem;
        }

        .food-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .food-description {
            color: #666;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .food-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #FF6B35;
            margin-bottom: 1rem;
        }

        .ar-button {
            background: linear-gradient(45deg, #FF6B35, #FFD700);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease;
            width: 100%;
        }

        .ar-button:hover {
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            position: relative;
            background: white;
            margin: 5% auto;
            padding: 2rem;
            border-radius: 20px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #ff4757;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
        }

        model-viewer {
            width: 100%;
            height: 400px;
            border-radius: 15px;
            margin-bottom: 1rem;
        }

        .ar-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .control-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: transform 0.2s ease;
        }

        .control-btn:hover {
            transform: scale(1.05);
        }

        .food-categories {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .category-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .category-btn.active,
        .category-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border-color: rgba(255, 255, 255, 0.9);
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }
            
            .food-grid {
                grid-template-columns: 1fr;
            }
            
            .nav-links {
                display: none;
            }
            
            .main-content {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="nav-container">
            <a href="#" class="logo">🍽️ Food Court AR</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="#menu">Menu</a></li>
                    <li><a href="#about">À propos</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Hero Section -->
        <section class="hero-section">
            <h1 class="hero-title">Découvrez nos plats en AR</h1>
            <p class="hero-subtitle">Une expérience culinaire immersive avec la réalité augmentée</p>
        </section>

        <!-- Categories -->
        <div class="food-categories">
            <button class="category-btn active" data-category="all">Tous</button>
            <button class="category-btn" data-category="burgers">Burgers</button>
            <button class="category-btn" data-category="pizzas">Pizzas</button>
            <button class="category-btn" data-category="asiatique">Asiatique</button>
            <button class="category-btn" data-category="desserts">Desserts</button>
        </div>

        <!-- Food Grid -->
        <div class="food-grid" id="foodGrid">
            <!-- Les plats seront générés par JavaScript -->
        </div>
    </main>

    <!-- Modal AR -->
    <div id="arModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeARModal()">&times;</button>
            <h2 id="modalTitle">Nom du plat</h2>
            <p id="modalDescription">Description du plat</p>
            <p id="modalPrice">Prix</p>
            
            <model-viewer 
                id="foodModel"
                camera-controls 
                auto-rotate 
                ar 
                ar-scale="auto"
                ar-placement="floor"
                shadow-intensity="2"
                tone-mapping="aces"
                exposure="1.2">
            </model-viewer>
            
            <div class="ar-controls">
                <button class="control-btn" onclick="resetModel()">🔄 Reset</button>
                <button class="control-btn" onclick="toggleRotation()">⏸️ Pause</button>
                <button class="control-btn" onclick="changeEnvironment()">💡 Éclairage</button>
                <button class="control-btn" onclick="tableMode()">🍽️ Mode Table</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration des plats
        const dishes = [
            {
                id: 1,
                name: "Burger Classic",
                description: "Pain artisanal, steak de bœuf, salade, tomate, oignons",
                price: "12.90€",
                category: "burgers",
                image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&h=300&fit=crop"
            },
            {
                id: 2,
                name: "Pizza Margherita",
                description: "Sauce tomate, mozzarella, basilic frais",
                price: "14.50€",
                category: "pizzas",
                image: "https://images.unsplash.com/photo-1565299624946-b28f40a0ca4b?w=400&h=300&fit=crop"
            },
            {
                id: 3,
                name: "Pad Thaï aux Crevettes",
                description: "Nouilles de riz, crevettes, légumes croquants, sauce traditionnelle",
                price: "16.90€",
                category: "asiatique",
                image: "https://images.unsplash.com/photo-1559314809-0f31657def5e?w=400&h=300&fit=crop"
            },
            {
                id: 4,
                name: "Burger Végétarien",
                description: "Steak végétal, avocat, roquette, tomate, sauce vegan",
                price: "13.50€",
                category: "burgers",
                image: "https://images.unsplash.com/photo-1525059696034-4967a729002e?w=400&h=300&fit=crop"
            },
            {
                id: 5,
                name: "Pizza 4 Fromages",
                description: "Mozzarella, gorgonzola, parmesan, chèvre",
                price: "16.90€",
                category: "pizzas",
                image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400&h=300&fit=crop"
            },
            {
                id: 6,
                name: "Bo Bun Bœuf",
                description: "Vermicelles de riz, bœuf grillé, légumes frais, nems",
                price: "15.90€",
                category: "asiatique",
                image: "https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=400&h=300&fit=crop"
            },
            {
                id: 7,
                name: "Tiramisu Maison",
                description: "Mascarpone, café, cacao, biscuits cuillère",
                price: "7.50€",
                category: "desserts",
                image: "https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=400&h=300&fit=crop"
            },
            {
                id: 8,
                name: "Burger BBQ",
                description: "Pain brioche, steak, bacon, oignons caramélisés, sauce BBQ",
                price: "15.90€",
                category: "burgers",
                image: "https://images.unsplash.com/photo-1553979459-d2229ba7433a?w=400&h=300&fit=crop"
            }
        ];

        // Variables globales
        let currentDish = null;
        let autoRotateEnabled = true;
        let environmentIndex = 0;

        // Environnements d'éclairage
        const environments = [
            'https://modelviewer.dev/shared-assets/environments/spruit_sunrise_1k_HDR.hdr',
            'https://modelviewer.dev/shared-assets/environments/aircraft_workshop_01_1k.hdr',
            'https://modelviewer.dev/shared-assets/environments/whipple_creek_regional_park_04_1k.hdr'
        ];

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            renderDishes('all');
            setupCategoryFilters();
        });

        // Rendu des plats
        function renderDishes(category) {
            const grid = document.getElementById('foodGrid');
            const filteredDishes = category === 'all' ? dishes : dishes.filter(dish => dish.category === category);
            
            grid.innerHTML = filteredDishes.map(dish => `
                <div class="food-card" onclick="openARModal(${dish.id})">
                    <img src="${dish.image}" alt="${dish.name}" class="food-image">
                    <h3 class="food-title">${dish.name}</h3>
                    <p class="food-description">${dish.description}</p>
                    <p class="food-price">${dish.price}</p>
                    <button class="ar-button">👁️ Voir en AR</button>
                </div>
            `).join('');
        }

        // Configuration des filtres de catégories
        function setupCategoryFilters() {
            const categoryBtns = document.querySelectorAll('.category-btn');
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    categoryBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    renderDishes(this.dataset.category);
                });
            });
        }

        // Ouvrir le modal AR
        function openARModal(dishId) {
            currentDish = dishes.find(dish => dish.id === dishId);
            if (!currentDish) return;

            document.getElementById('modalTitle').textContent = currentDish.name;
            document.getElementById('modalDescription').textContent = currentDish.description;
            document.getElementById('modalPrice').textContent = currentDish.price;

            const modelViewer = document.getElementById('foodModel');
            modelViewer.src = './models/burgertest.glb'; // Même modèle pour tous les plats
            modelViewer.scale = '0.1 0.1 0.1';
            modelViewer.cameraOrbit = '0deg 75deg 2m';
            modelViewer.environmentImage = environments[0];

            document.getElementById('arModal').style.display = 'block';
            
            // Animation d'entrée
            setTimeout(() => {
                document.querySelector('.modal-content').style.transform = 'scale(1)';
                document.querySelector('.modal-content').style.opacity = '1';
            }, 10);
        }

        // Fermer le modal AR
        function closeARModal() {
            const modal = document.getElementById('arModal');
            modal.style.display = 'none';
            
            // Nettoyer le modèle
            const modelViewer = document.getElementById('foodModel');
            modelViewer.src = '';
        }

        // Reset du modèle
        function resetModel() {
            const modelViewer = document.getElementById('foodModel');
            modelViewer.cameraOrbit = '0deg 75deg 2m';
            modelViewer.scale = '0.1 0.1 0.1';
            showToast('🔄 Position réinitialisée');
        }

        // Toggle rotation
        function toggleRotation() {
            const modelViewer = document.getElementById('foodModel');
            const btn = event.target;
            
            autoRotateEnabled = !autoRotateEnabled;
            modelViewer.autoRotate = autoRotateEnabled;
            btn.textContent = autoRotateEnabled ? '⏸️ Pause' : '▶️ Play';
            
            showToast(autoRotateEnabled ? '▶️ Rotation activée' : '⏸️ Rotation pausée');
        }

        // Changer l'environnement
        function changeEnvironment() {
            const modelViewer = document.getElementById('foodModel');
            environmentIndex = (environmentIndex + 1) % environments.length;
            modelViewer.environmentImage = environments[environmentIndex];
            
            const envNames = ['🌅 Lever de soleil', '🏭 Atelier', '🌲 Forêt'];
            showToast(`💡 ${envNames[environmentIndex]}`);
        }

        // Mode table
        function tableMode() {
            const modelViewer = document.getElementById('foodModel');
            modelViewer.cameraOrbit = '0deg 45deg 1.5m';
            modelViewer.setAttribute('shadow-intensity', '3');
            showToast('🍽️ Mode table activé');
        }

        // Toast notification
        function showToast(message) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%) translateY(-100px);
                background: linear-gradient(45deg, #667eea, #764ba2);
                color: white;
                padding: 12px 24px;
                border-radius: 25px;
                font-weight: bold;
                z-index: 10000;
                box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
                transition: transform 0.3s ease;
            `;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.transform = 'translateX(-50%) translateY(0)';
            }, 100);
            
            setTimeout(() => {
                toast.style.transform = 'translateX(-50%) translateY(-100px)';
                setTimeout(() => {
                    if (toast.parentNode) {
                        document.body.removeChild(toast);
                    }
                }, 300);
            }, 2000);
        }

        // Fermer le modal en cliquant à l'extérieur
        window.onclick = function(event) {
            const modal = document.getElementById('arModal');
            if (event.target === modal) {
                closeARModal();
            }
        }
    </script>
</body>
</html>
