<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6AVENUES - AR Experience</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@100;200;300;400;500;600;700;800;900&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Couleurs principales - Système Apple-like */
            --primary: #FDBD11;
            --primary-dark: #E6A600;
            --primary-light: #FFC82C;
            --primary-ultra-light: #FFF4D6;
            
            /* Gradients premium */
            --gradient-primary: linear-gradient(135deg, #FDBD11 0%, #F5A623 50%, #E6A600 100%);
            --gradient-secondary: linear-gradient(135deg, #FFC82C 0%, #FDBD11 50%, #F5A623 100%);
            --gradient-accent: linear-gradient(135deg, #FFD700 0%, #FFC107 50%, #F5A623 100%);
            --gradient-mesh: conic-gradient(from 180deg at 50% 50%, #FDBD11 0deg, #F5A623 72deg, #E6A600 144deg, #FFC107 216deg, #FFD700 288deg, #FDBD11 360deg);
            
            /* Dark theme premium */
            --bg-primary: #000000;
            --bg-secondary: #0A0A0A;
            --bg-tertiary: #111111;
            --bg-quaternary: #1A1A1A;
            --bg-glass: rgba(0, 0, 0, 0.8);
            --bg-glass-light: rgba(255, 255, 255, 0.05);
            
            /* Text hierarchy */
            --text-primary: #FFFFFF;
            --text-secondary: #E5E5E7;
            --text-tertiary: #A1A1A6;
            --text-quaternary: #6D6D70;
            --text-accent: var(--primary);
            
            /* Borders & Strokes */
            --border-primary: rgba(255, 255, 255, 0.1);
            --border-secondary: rgba(255, 255, 255, 0.05);
            --border-accent: rgba(253, 189, 17, 0.3);
            
            /* Shadows - Apple-style */
            --shadow-small: 0 1px 3px rgba(0, 0, 0, 0.4);
            --shadow-medium: 0 4px 16px rgba(0, 0, 0, 0.3);
            --shadow-large: 0 12px 48px rgba(0, 0, 0, 0.4);
            --shadow-extra-large: 0 24px 80px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 32px rgba(253, 189, 17, 0.4);
            --shadow-inner: inset 0 1px 0 rgba(255, 255, 255, 0.1);
            
            /* Radius system */
            --radius-xs: 4px;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-2xl: 32px;
            --radius-full: 9999px;
            
            /* Spacing system */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-2xl: 48px;
            --space-3xl: 64px;
            --space-4xl: 96px;
            
            /* Animation system */
            --ease-in-out-quart: cubic-bezier(0.77, 0, 0.175, 1);
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.68, -0.55, 0.265, 1.55);
            --transition-fast: 200ms var(--ease-out-expo);
            --transition-medium: 300ms var(--ease-out-expo);
            --transition-slow: 500ms var(--ease-out-expo);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        /* Selection styling */
        ::selection {
            background: var(--primary);
            color: var(--bg-primary);
        }

        /* Focus states */
        :focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* Micro-interactions et animations premium */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translate3d(0, 40px, 0);
            }
            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translate3d(-60px, 0, 0);
            }
            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(253, 189, 17, 0.3);
            }
            50% {
                box-shadow: 0 0 40px rgba(253, 189, 17, 0.6);
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Effet de fumée pour les burgers */
        @keyframes smoke {
            0% {
                opacity: 0.8;
                transform: translateY(0px) translateX(0px) scale(0.5);
            }
            25% {
                opacity: 0.6;
                transform: translateY(-20px) translateX(-2px) scale(0.7);
            }
            50% {
                opacity: 0.4;
                transform: translateY(-40px) translateX(2px) scale(0.9);
            }
            75% {
                opacity: 0.2;
                transform: translateY(-60px) translateX(-1px) scale(1.1);
            }
            100% {
                opacity: 0;
                transform: translateY(-80px) translateX(1px) scale(1.3);
            }
        }

        @keyframes smoke2 {
            0% {
                opacity: 0.6;
                transform: translateY(0px) translateX(0px) scale(0.3);
            }
            30% {
                opacity: 0.5;
                transform: translateY(-25px) translateX(3px) scale(0.6);
            }
            60% {
                opacity: 0.3;
                transform: translateY(-45px) translateX(-2px) scale(0.8);
            }
            100% {
                opacity: 0;
                transform: translateY(-70px) translateX(2px) scale(1);
            }
        }

        @keyframes smoke3 {
            0% {
                opacity: 0.7;
                transform: translateY(0px) translateX(0px) scale(0.4);
            }
            20% {
                opacity: 0.6;
                transform: translateY(-15px) translateX(-3px) scale(0.5);
            }
            40% {
                opacity: 0.4;
                transform: translateY(-35px) translateX(1px) scale(0.7);
            }
            70% {
                opacity: 0.2;
                transform: translateY(-55px) translateX(-1px) scale(0.9);
            }
            100% {
                opacity: 0;
                transform: translateY(-75px) translateX(2px) scale(1.1);
            }
        }

        /* Header niveau GAFAM */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 72px;
            background: var(--bg-glass);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            z-index: 1000;
            border-bottom: 0.5px solid var(--border-primary);
            animation: slideInLeft 0.8s var(--ease-out-expo);
            will-change: transform;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.4) 100%);
            z-index: -1;
        }

        .nav-container {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 var(--space-lg);
            height: 100%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            font-family: 'SF Pro Display', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.5px;
            transition: var(--transition-medium);
            cursor: pointer;
        }

        .logo img {
            height: 40px;
            width: auto;
            filter: brightness(1.2);
            transition: var(--transition-medium);
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo:hover img {
            filter: brightness(1.4);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: var(--space-sm);
            align-items: center;
        }

        .nav-links li {
            position: relative;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            padding: var(--space-sm) var(--space-md);
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            border-radius: var(--radius-lg);
            transition: var(--transition-medium);
            position: relative;
            overflow: hidden;
        }

        .nav-links a::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-glass-light);
            opacity: 0;
            transition: var(--transition-fast);
        }

        .nav-links a:hover {
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        .nav-links a:hover::before {
            opacity: 1;
        }

        .nav-links a:active {
            transform: translateY(0);
        }

        /* Main content */
        .main-content {
            margin-top: 72px;
            min-height: 100vh;
        }

        /* Hero Section niveau Apple */
        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            background: radial-gradient(ellipse at center, var(--bg-secondary) 0%, var(--bg-primary) 70%);
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: var(--gradient-mesh);
            opacity: 0.03;
            animation: rotate 60s linear infinite;
        }

        .hero-section::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(600px circle at 20% 30%, rgba(253, 189, 17, 0.1) 0%, transparent 50%),
                radial-gradient(400px circle at 80% 70%, rgba(253, 189, 17, 0.05) 0%, transparent 50%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
            padding: 0 var(--space-lg);
            animation: fadeInUp 1.2s var(--ease-out-expo);
        }

        .hero-title {
            font-size: clamp(3.5rem, 8vw, 7rem);
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -0.04em;
            margin-bottom: var(--space-lg);
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            font-size: 21px;
            font-weight: 400;
            color: var(--text-tertiary);
            margin-bottom: var(--space-3xl);
            line-height: 1.5;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-md) var(--space-xl);
            background: var(--gradient-primary);
            color: var(--bg-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 17px;
            border-radius: var(--radius-full);
            transition: var(--transition-medium);
            box-shadow: var(--shadow-large), var(--shadow-glow);
            position: relative;
            overflow: hidden;
            animation: float 4s ease-in-out infinite;
        }

        .hero-cta::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: var(--transition-slow);
        }

        .hero-cta:hover::before {
            left: 100%;
        }

        .hero-cta:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: var(--shadow-extra-large), 0 0 60px rgba(253, 189, 17, 0.6);
        }

        .hero-cta:active {
            transform: translateY(0) scale(0.98);
        }

        /* Categories avec images - Design ultra premium */
        .categories-section {
            padding: var(--space-4xl) var(--space-lg);
            background: var(--bg-secondary);
            position: relative;
        }

        .categories-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-primary), transparent);
        }

        .categories-nav {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: var(--space-lg);
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--space-xl);
        }

        .category-btn {
            position: relative;
            background: var(--bg-quaternary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-xl);
            cursor: pointer;
            transition: var(--transition-slow);
            overflow: hidden;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 0;
            font-family: inherit;
        }

        .category-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, 
                transparent 0%, 
                rgba(0, 0, 0, 0.3) 50%, 
                rgba(0, 0, 0, 0.8) 100%);
            z-index: 2;
            transition: var(--transition-medium);
        }

        .category-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient-primary);
            opacity: 0;
            transition: var(--transition-medium);
            z-index: 1;
        }

        .category-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition-slow);
            z-index: 1;
        }

        .category-label {
            position: relative;
            z-index: 3;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 14px;
            text-align: center;
            padding: var(--space-md);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            transition: var(--transition-medium);
        }

        .category-btn:hover {
            transform: translateY(-4px) scale(1.03);
            border-color: var(--border-accent);
            box-shadow: var(--shadow-large), var(--shadow-glow);
        }

        .category-btn:hover::after {
            opacity: 0.15;
        }

        .category-btn:hover .category-image {
            transform: scale(1.1);
        }

        .category-btn:hover .category-label {
            color: var(--primary);
            text-shadow: 0 0 16px rgba(253, 189, 17, 0.8);
        }

        .category-btn.active {
            border-color: var(--primary);
            box-shadow: var(--shadow-large), 0 0 40px rgba(253, 189, 17, 0.4);
            transform: translateY(-6px) scale(1.05);
        }

        .category-btn.active::after {
            opacity: 0.2;
        }

        .category-btn.active .category-label {
            color: var(--primary);
            text-shadow: 0 0 20px rgba(253, 189, 17, 0.9);
        }

        .category-btn.active .category-image {
            transform: scale(1.15);
        }

        .category-btn:active {
            transform: translateY(-2px) scale(1.01);
        }

        /* Grid cards niveau Netflix/Apple */
        .restaurants-section {
            padding: var(--space-4xl) var(--space-lg);
            background: var(--bg-primary);
        }

        .restaurants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: var(--space-xl);
            max-width: 1440px;
            margin: 0 auto;
        }

        .restaurant-card {
            background: var(--bg-quaternary);
            border-radius: var(--radius-xl);
            overflow: hidden;
            border: 1px solid var(--border-primary);
            transition: var(--transition-slow);
            cursor: pointer;
            position: relative;
            will-change: transform;
            animation: scaleIn 0.6s var(--ease-out-expo);
            animation-fill-mode: both;
        }

        .restaurant-card:nth-child(1) { animation-delay: 0.1s; }
        .restaurant-card:nth-child(2) { animation-delay: 0.2s; }
        .restaurant-card:nth-child(3) { animation-delay: 0.3s; }
        .restaurant-card:nth-child(4) { animation-delay: 0.4s; }

        .restaurant-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient-primary);
            opacity: 0;
            transition: var(--transition-medium);
            z-index: 1;
        }

        .restaurant-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--border-accent);
            box-shadow: var(--shadow-extra-large), var(--shadow-glow);
        }

        .restaurant-card:hover::before {
            opacity: 0.05;
        }

        .restaurant-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            object-position: center;
            transition: var(--transition-slow);
            position: relative;
            z-index: 2;
            border-radius: 0;
        }

        .restaurant-card:hover .restaurant-image {
            transform: scale(1.05);
        }

        /* Model Viewer dans les cartes */
        .restaurant-model {
            width: 100%;
            height: 280px;
            border-radius: 0;
            background: var(--bg-primary);
            border: none;
            position: relative;
            z-index: 2;
            overflow: hidden;
        }

        .restaurant-card:hover .restaurant-model {
            transform: scale(1.05);
        }

        /* Container pour la fumée */
        .smoke-container {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 80px;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        /* Particules de fumée */
        .smoke-particle {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(200, 200, 200, 0.4) 50%, rgba(150, 150, 150, 0.1) 100%);
            border-radius: 50%;
            filter: blur(1px);
            transform-origin: center;
        }

        .smoke-particle:nth-child(1) {
            animation: smoke 3s ease-out infinite;
            animation-delay: 0s;
            left: 45%;
        }

        .smoke-particle:nth-child(2) {
            animation: smoke2 3.5s ease-out infinite;
            animation-delay: 0.5s;
            left: 55%;
        }

        .smoke-particle:nth-child(3) {
            animation: smoke3 2.8s ease-out infinite;
            animation-delay: 1s;
            left: 50%;
        }

        .smoke-particle:nth-child(4) {
            animation: smoke 3.2s ease-out infinite;
            animation-delay: 1.5s;
            left: 48%;
        }

        .smoke-particle:nth-child(5) {
            animation: smoke2 3.8s ease-out infinite;
            animation-delay: 2s;
            left: 52%;
        }

        /* Fumée visible seulement au hover */
        .restaurant-card .smoke-container {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .restaurant-card:hover .smoke-container {
            opacity: 1;
        }

        .restaurant-content {
            padding: var(--space-xl);
            position: relative;
            z-index: 2;
        }

        .restaurant-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: var(--space-sm);
            color: var(--text-primary);
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .restaurant-description {
            font-size: 16px;
            color: var(--text-tertiary);
            margin-bottom: var(--space-lg);
            line-height: 1.5;
        }

        .restaurant-price {
            font-size: 28px;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--space-xl);
            letter-spacing: -0.5px;
        }

        .ar-button {
            width: 100%;
            padding: var(--space-md) var(--space-lg);
            background: var(--gradient-primary);
            color: var(--bg-primary);
            border: none;
            border-radius: var(--radius-lg);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition-medium);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-medium);
        }

        .ar-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: var(--transition-slow);
        }

        .ar-button:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-large);
        }

        .ar-button:hover::before {
            left: 100%;
        }

        .ar-button:active {
            transform: translateY(0) scale(0.98);
        }

        .ar-button i {
            margin-right: var(--space-sm);
        }

        /* Modal AR niveau Apple/Google */
        .modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(24px);

            document.addEventListener('click', () => userInteractions++);
            document.addEventListener('scroll', () => userInteractions++);

        // Effet visuel de clic
        function createSoundRipple(e) {
            const ripple = document.createElement('div');
            ripple.className = 'sound-ripple';
            ripple.style.left = (e.clientX - 40) + 'px';
            ripple.style.top = (e.clientY - 40) + 'px';
            document.body.appendChild(ripple);
            
            setTimeout(() => ripple.remove(), 600);

        // Notifications live simulées
        function showLiveNotification() {
            const container = document.getElementById('liveNotifications');
            const message = notificationMessages[Math.floor(Math.random() * notificationMessages.length)];

            notification.className = 'notification';
            notification.innerHTML = `

                    <div>
                        <div class="notification-text"><strong>${message.name}</strong> ${message.action}</div>
                        <div class="notification-time">${message.time}</div>
                    </div>
                </div>
            `;
            
            container.appendChild(notification);
            
            // Animation d'entrée
            setTimeout(() => notification.classList.add('show'), 100);
            
            // Suppression après 4 secondes
            setTimeout(() => {
                notification.style.transform = 'translateX(100%)';

            animateNumber(activeUsers, currentUsers);
            animateNumber(arViews, currentViews);
            animateNumber(engagement, currentEngagement, '%');
        }

        // Animation des nombres
        function animateNumber(element, targetValue, suffix = '') {
            const currentValue = parseInt(element.textContent) || 0;
            const increment = (targetValue - currentValue) / 10;
            let current = currentValue;
            
            const animation = setInterval(() => {
                current += increment;
                if ((increment > 0 && current >= targetValue) || (increment < 0 && current <= targetValue)) {
                    current = targetValue;
                    clearInterval(animation);
                }
                element.textContent = Math.round(current) + suffix;
            }, 50);
        }

                            auto-rotate 
                            shadow-intensity="1"
                            scale="${dish.scale || '0.1 0.1 0.1'}"
                            camera-orbit="0deg 75deg 2m"
                            disable-zoom
                            interaction-prompt="none"
                            loading="lazy">
                        </model-viewer>
                        ${dish.category === 'burgers' || dish.name.toLowerCase().includes('burger') || dish.name.toLowerCase().includes('steak') ? `
                        <div class="smoke-container">
                            <div class="smoke-particle"></div>
                            <div class="smoke-particle"></div>
                            <div class="smoke-particle"></div>
                            <div class="smoke-particle"></div>
                            <div class="smoke-particle"></div>
                        </div>
                        ` : ''}
                    </div>
                    <div class="restaurant-content">
                        <h3 class="restaurant-name">${dish.name}</h3>
                        <p class="restaurant-description">${dish.description}</p>
                        <p class="restaurant-price price-counter">${dish.price}</p>
                        <button class="ar-button" onclick="event.stopPropagation(); openARModal(${dish.id}); trackARView('${dish.name}')">
                            <i class="fas fa-eye"></i>
                            VOIR EN AR
                        </button>
                    </div>
                </div>
            `).join('');
            
            // Trigger scroll reveal animation
            setTimeout(() => {
                document.querySelectorAll('.scroll-reveal').forEach((el, index) => {
                    setTimeout(() => {
                        el.classList.add('revealed');
                    }, index * 100);
                });
            }, 100);
        }

        // Tracking des interactions
        function trackCardClick(dishName) {
            totalViews++;
            console.log(`🎯 Card clicked: ${dishName} (Total views: ${totalViews})`);
        }

        function trackARView(dishName) {
            console.log(`🚀 AR View: ${dishName}`);
            // Simulation notification
            setTimeout(() => {
                showCustomNotification(`Quelqu'un explore ${dishName} en AR !`);
            }, 1000);
        }

        function showCustomNotification(message) {
            const container = document.getElementById('liveNotifications');
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.innerHTML = `
                <div class="notification-content">
                    <div class="notification-avatar">🔥</div>
                    <div>
                        <div class="notification-text">${message}</div>
                        <div class="notification-time">à l'instant</div>
                    </div>
                </div>
            `;
            
            container.appendChild(notification);
            setTimeout(() => notification.classList.add('show'), 100);
            setTimeout(() => {
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => notification.remove(), 400);
            }, 3000);
        }

        function setupCategoryFilters() {
            const categoryBtns = document.querySelectorAll('.category-btn');
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    categoryBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    renderRestaurants(this.dataset.category);
                });
            });
        }

        function openARModal(dishId) {
            currentDish = dishes.find(dish => dish.id === dishId);
            if (!currentDish) return;

            document.getElementById('modalTitle').textContent = currentDish.name;
            document.getElementById('modalDescription').textContent = currentDish.description;
            document.getElementById('modalPrice').textContent = currentDish.price;

            const modelViewer = document.getElementById('foodModel');
            // Utilise le modèle spécifique ou le burger par défaut
            modelViewer.src = currentDish.model3d || './models/burgertest.glb';
            modelViewer.scale = currentDish.scale || '0.1 0.1 0.1';
            modelViewer.cameraOrbit = '0deg 75deg 2m';
            modelViewer.environmentImage = environments[0];

            // Affiche la taille réelle si disponible
            if (currentDish.realSize) {
                const sizeInfo = document.createElement('p');
                sizeInfo.textContent = `Taille réelle : ${currentDish.realSize}`;
                sizeInfo.style.color = '#666666';
                sizeInfo.style.fontSize = '0.8rem';
                sizeInfo.style.marginBottom = '1rem';
                sizeInfo.id = 'realSizeInfo';
                
                // Supprime l'ancienne info si elle existe
                const oldInfo = document.getElementById('realSizeInfo');
                if (oldInfo) oldInfo.remove();
                
                // Ajoute après la description
                document.getElementById('modalPrice').parentNode.insertBefore(sizeInfo, document.getElementById('modalPrice'));
            }

            document.getElementById('arModal').style.display = 'block';
        }

        function closeARModal() {
            document.getElementById('arModal').style.display = 'none';
            document.getElementById('foodModel').src = '';
        }

        function resetModel() {
            const modelViewer = document.getElementById('foodModel');
            modelViewer.cameraOrbit = '0deg 75deg 2m';
            modelViewer.scale = '0.1 0.1 0.1';
        }

        function toggleRotation() {
            const modelViewer = document.getElementById('foodModel');
            const btn = event.target.closest('.control-btn');
            const icon = btn.querySelector('i');
            autoRotateEnabled = !autoRotateEnabled;
            modelViewer.autoRotate = autoRotateEnabled;
            
            if (autoRotateEnabled) {
                btn.innerHTML = '<i class="fas fa-pause"></i> PAUSE';
            } else {
                btn.innerHTML = '<i class="fas fa-play"></i> PLAY';
            }
        }

        // Smooth scrolling for navigation
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Add loading screen
        window.addEventListener('load', function() {
            setTimeout(() => {
                const loading = document.querySelector('.loading');
                if (loading) {
                    loading.classList.add('hidden');
                    setTimeout(() => loading.remove(), 500);
                }
            }, 1000);
        });

        // Intersection Observer for scroll animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('revealed');
                }
            });
        }, observerOptions);

        function changeEnvironment() {
            const modelViewer = document.getElementById('foodModel');
            environmentIndex = (environmentIndex + 1) % environments.length;
            modelViewer.environmentImage = environments[environmentIndex];
        }

        function tableMode() {
            const modelViewer = document.getElementById('foodModel');
            modelViewer.cameraOrbit = '0deg 45deg 1.5m';
            modelViewer.setAttribute('shadow-intensity', '2');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('arModal');
            if (event.target === modal) {
                closeARModal();
            }
        }
    </script>
</body>
</html>
