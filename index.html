<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu AR - 6AVENUES Restaurant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&family=Gettalk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <!-- Scripts modulaires (ordre important) -->
    <script src="js/data.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/main.js"></script>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading">
        <div class="spinner"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="./img/6avenues-logo-1.png" alt="6AVENUES" />
            </a>
            
            <!-- Theme Selector -->
            <div class="theme-selector">
                <label for="themeSelect">Thème :</label>
                <div class="custom-dropdown">
                    <div class="dropdown-selected" onclick="toggleDropdown()">
                        <span id="selectedTheme">🌿 Vert Nature</span>
                        <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <polyline points="6,9 12,15 18,9"></polyline>
                        </svg>
                    </div>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <div class="dropdown-option" data-theme="custom-green">🌿 Vert Nature</div>
                        <div class="dropdown-option" data-theme="mcdonalds">🍟 McDonald's</div>
                        <div class="dropdown-option" data-theme="burger-king">👑 Burger King</div>
                        <div class="dropdown-option" data-theme="taco-bell">🌮 Taco Bell</div>
                        <div class="dropdown-option" data-theme="subway">🥪 Subway</div>
                        <div class="dropdown-option" data-theme="eleven-madison">⭐ Eleven Madison Park</div>
                        <div class="dropdown-option" data-theme="daniel-nyc">🍷 Daniel NYC</div>
                    </div>
                </div>
            </div>
            
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="#menu">Notre Menu</a></li>
                    <li><a href="index.html#about">À propos</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                    <li><a href="https://6avenues.com/" target="_blank">Site Principal</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Categories Navigation -->
        <section class="categories-section">
            <div class="categories-nav">
                <button class="category-btn active" data-category="all">
                    <img src="./img/6th-avenues-Yankee-menu.jpg" alt="Tous" class="category-image">
                    <span class="category-label">Tous nos plats</span>
                </button>
                <button class="category-btn" data-category="burgers">
                    <img src="./img/6th-avenues-Yankee-menu.jpg" alt="Burgers" class="category-image">
                    <span class="category-label">Burgers</span>
                </button>
                <button class="category-btn" data-category="pizzas">
                    <img src="./img/6th-avenues-FRATELLI-menu.jpg" alt="Pizzas" class="category-image">
                    <span class="category-label">Pizzas</span>
                </button>
                <button class="category-btn" data-category="asiatique">
                    <img src="./img/6th-avenues-Asia-menu.jpg" alt="Asiatique" class="category-image">
                    <span class="category-label">Asiatique</span>
                </button>
                <button class="category-btn" data-category="sandwichs">
                    <img src="./img/6th-avenues-los-pollos-menu.jpg" alt="Sandwichs" class="category-image">
                    <span class="category-label">Sandwichs</span>
                </button>
                <button class="category-btn" data-category="desserts">
                    <img src="./img/6th-avenues-CANDY-Bar-menu.jpg" alt="Desserts" class="category-image">
                    <span class="category-label">Desserts</span>
                </button>
            </div>
        </section>

        <!-- Menu Section -->
        <section class="restaurants-section" id="menu">
            <div class="restaurants-grid" id="restaurantsGrid">
                <!-- Les cartes seront générées par JavaScript -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p class="footer-text">© Maquette Présentation AR</a></p>
            <div class="social-links">
                <a href="https://www.instagram.com/6avenues/" class="social-link" target="_blank">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://6avenues.com/" class="social-link" target="_blank">
                    <i class="fas fa-globe"></i>
                </a>
                <a href="#" class="social-link">
                    <i class="fas fa-phone"></i>
                </a>
            </div>
        </div>
    </footer>

    <!-- Bouton Retour en Haut -->
    <button id="backToTop" class="back-to-top" onclick="scrollToTop()">
        <i class="fas fa-chevron-up"></i>
    </button>

    <!-- Modal AR -->
    <div id="arModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeARModal()">
                <i class="fas fa-times"></i>
            </button>
            <h2 id="modalTitle" class="modal-title">PLAT</h2>
            <p id="modalDescription" class="modal-description">Description</p>
            <p id="modalPrice" class="modal-price">Prix</p>
            
            <model-viewer 
                id="foodModel"
                camera-controls 
                auto-rotate
                ar
                ar-scale="auto"
                ar-placement="floor"
                shadow-intensity="1"
                shadow-softness="1" 
                tone-mapping="neutral"
                exposure="1"
                xr-environment
                touch-action="pan-y">
                <button slot="ar-button" class="custom-ar-button">
                    <i class="fas fa-cube"></i> Afficher AR
                </button>
                
                <!-- 🎛️ Contrôles de test compacts -->
                <div class="lighting-controls-compact">
                    <button class="toggle-controls" id="toggleControls">⚙️</button>
                    <div class="controls-panel" id="controlsPanel">
                        <select id="toneMapping" title="Tone Mapping">
                            <option value="neutral">Neutral</option>
                            <option value="aces">ACES</option>
                            <option value="agx">AgX</option>
                        </select>
                        <select id="modelSelector" title="Modèle">
                            <option value="./models/burger3.glb">B3</option>
                            <option value="./models/burgertest.glb">BT</option>
                            <option value="./models/burgertest2.glb">BT2</option>
                        </select>
                        <label class="mini-checkbox" title="Éclairage neutre">
                            <input id="neutralLighting" type="checkbox" checked="true">
                            💡
                        </label>
                    </div>
                </div>
            </model-viewer>

            <div class="ar-controls">
                <!-- <button class="control-btn primary" onclick="startARGame()">
                    <i class="fas fa-gamepad"></i>
                    Mini-jeu AR
                </button> -->
            </div>
        </div>
    </div>

    <!-- 📦 Scripts modulaires -->
    <script src="js/data.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
