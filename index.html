<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOD COURT AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header exact comme 6avenues */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            height: 80px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 3rem;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 400;
            font-size: 0.95rem;
            transition: color 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-links a:hover {
            color: #cccccc;
        }

        /* Main content comme 6avenues */
        .main-content {
            margin-top: 80px;
            min-height: 100vh;
        }

        .hero-section {
            text-align: center;
            padding: 4rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 1rem;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            line-height: 0.9;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            font-weight: 300;
            color: #cccccc;
            margin-bottom: 3rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Grid de restaurants comme 6avenues */
        .restaurants-section {
            padding: 0 2rem 4rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 3rem;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .restaurants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .restaurant-card {
            background-color: #000000;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2rem;
            text-align: center;
            transition: background-color 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .restaurant-card:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .restaurant-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            margin-bottom: 1.5rem;
            filter: grayscale(100%);
            transition: filter 0.3s ease;
        }

        .restaurant-card:hover .restaurant-image {
            filter: grayscale(0%);
        }

        .restaurant-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: -0.01em;
        }

        .restaurant-description {
            font-size: 0.95rem;
            color: #cccccc;
            margin-bottom: 1rem;
            font-weight: 300;
        }

        .restaurant-price {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 1.5rem;
        }

        .ar-button {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.8rem 2rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.85rem;
        }

        .ar-button:hover {
            background-color: #ffffff;
            color: #000000;
        }

        /* Modal style 6avenues */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            backdrop-filter: blur(20px);
        }

        .modal-content {
            position: relative;
            background-color: #000000;
            margin: 2% auto;
            padding: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .modal-description {
            color: #cccccc;
            margin-bottom: 1rem;
            font-weight: 300;
        }

        .modal-price {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 2rem;
        }

        model-viewer {
            width: 100%;
            height: 400px;
            margin-bottom: 2rem;
            background-color: #111111;
        }

        .ar-controls {
            display: flex;
            gap: 0;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-btn {
            background-color: transparent;
            color: #ffffff;
            border: none;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 1.5rem;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background-color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }

        .control-btn:last-child {
            border-right: none;
        }

        .control-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Navigation categories style 6avenues */
        .categories-nav {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-bottom: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 3rem;
        }

        .category-btn {
            background-color: transparent;
            color: #ffffff;
            border: none;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.85rem;
        }

        .category-btn:last-child {
            border-right: none;
        }

        .category-btn.active,
        .category-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Footer style 6avenues */
        .footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2rem;
            text-align: center;
            background-color: #000000;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        .footer-text {
            color: #cccccc;
            font-weight: 300;
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }
            
            .restaurants-grid {
                grid-template-columns: 1fr;
            }
            
            .nav-links {
                display: none;
            }
            
            .categories-nav {
                flex-direction: column;
            }
            
            .category-btn {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
            
            .category-btn:last-child {
                border-bottom: none;
            }
            
            .ar-controls {
                flex-direction: column;
            }
            
            .control-btn {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
            
            .control-btn:last-child {
                border-bottom: none;
            }
        }
    </style>
</head>
<body>
    <!-- Header exact comme 6avenues -->
    <header class="header">
        <div class="nav-container">
            <a href="#" class="logo">FOOD COURT</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="#menu">MENU</a></li>
                    <li><a href="#restaurants">RESTAURANTS</a></li>
                    <li><a href="#contact">CONTACT</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Hero Section style 6avenues -->
        <section class="hero-section">
            <h1 class="hero-title">FOOD COURT</h1>
            <p class="hero-subtitle">6 Restaurants - Une seule Adresse<br>Découvrez nos plats en Réalité Augmentée</p>
        </section>

        <!-- Categories Navigation -->
        <div class="categories-nav">
            <button class="category-btn active" data-category="all">TOUS</button>
            <button class="category-btn" data-category="burgers">BURGERS</button>
            <button class="category-btn" data-category="pizzas">PIZZAS</button>
            <button class="category-btn" data-category="asiatique">ASIATIQUE</button>
            <button class="category-btn" data-category="desserts">DESSERTS</button>
        </div>

        <!-- Restaurants Section -->
        <section class="restaurants-section">
            <div class="restaurants-grid" id="restaurantsGrid">
                <!-- Les restaurants seront générés par JavaScript -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p class="footer-text">© 2024 FOOD COURT AR - Tous droits réservés</p>
        </div>
    </footer>

    <!-- Modal AR -->
    <div id="arModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeARModal()">&times;</button>
            <h2 id="modalTitle" class="modal-title">PLAT</h2>
            <p id="modalDescription" class="modal-description">Description</p>
            <p id="modalPrice" class="modal-price">Prix</p>
            
            <model-viewer 
                id="foodModel"
                camera-controls 
                auto-rotate 
                ar 
                ar-scale="auto"
                ar-placement="floor"
                shadow-intensity="2"
                tone-mapping="aces"
                exposure="1.2">
            </model-viewer>
            
            <div class="ar-controls">
                <button class="control-btn" onclick="resetModel()">RESET</button>
                <button class="control-btn" onclick="toggleRotation()">PAUSE</button>
                <button class="control-btn" onclick="changeEnvironment()">ÉCLAIRAGE</button>
                <button class="control-btn" onclick="tableMode()">MODE TABLE</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration des plats style 6avenues
        const dishes = [
            {
                id: 1,
                name: "BURGER CLASSIC",
                description: "Pain artisanal, steak de bœuf grillé, salade fraîche, tomate, oignons",
                price: "12.90€",
                category: "burgers",
                image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&h=300&fit=crop&auto=format"
            },
            {
                id: 2,
                name: "PIZZA MARGHERITA",
                description: "Sauce tomate artisanale, mozzarella di bufala, basilic frais",
                price: "14.50€",
                category: "pizzas",
                image: "https://images.unsplash.com/photo-1565299624946-b28f40a0ca4b?w=500&h=300&fit=crop&auto=format"
            },
            {
                id: 3,
                name: "PAD THAÏ CREVETTES",
                description: "Nouilles de riz sautées, crevettes fraîches, légumes croquants, sauce traditionnelle",
                price: "16.90€",
                category: "asiatique",
                image: "https://images.unsplash.com/photo-1559314809-0f31657def5e?w=500&h=300&fit=crop&auto=format"
            },
            {
                id: 4,
                name: "BURGER VÉGÉTARIEN",
                description: "Steak végétal maison, avocat, roquette, tomate, sauce vegan",
                price: "13.50€",
                category: "burgers",
                image: "https://images.unsplash.com/photo-1525059696034-4967a729002e?w=500&h=300&fit=crop&auto=format"
            },
            {
                id: 5,
                name: "PIZZA 4 FROMAGES",
                description: "Mozzarella, gorgonzola AOP, parmesan 24 mois, chèvre",
                price: "16.90€",
                category: "pizzas",
                image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500&h=300&fit=crop&auto=format"
            },
            {
                id: 6,
                name: "BO BUN BŒUF",
                description: "Vermicelles de riz, bœuf grillé, légumes frais, nems, sauce nuoc-mâm",
                price: "15.90€",
                category: "asiatique",
                image: "https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=500&h=300&fit=crop&auto=format"
            },
            {
                id: 7,
                name: "TIRAMISU MAISON",
                description: "Mascarpone, café espresso, cacao pur, biscuits cuillère",
                price: "7.50€",
                category: "desserts",
                image: "https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=500&h=300&fit=crop&auto=format"
            },
            {
                id: 8,
                name: "BURGER BBQ",
                description: "Pain brioche, steak premium, bacon croustillant, oignons caramélisés, sauce BBQ",
                price: "15.90€",
                category: "burgers",
                image: "https://images.unsplash.com/photo-1553979459-d2229ba7433a?w=500&h=300&fit=crop&auto=format"
            }
        ];

        // Variables globales
        let currentDish = null;
        let autoRotateEnabled = true;
        let environmentIndex = 0;

        // Environnements d'éclairage
        const environments = [
            'https://modelviewer.dev/shared-assets/environments/spruit_sunrise_1k_HDR.hdr',
            'https://modelviewer.dev/shared-assets/environments/aircraft_workshop_01_1k.hdr',
            'https://modelviewer.dev/shared-assets/environments/whipple_creek_regional_park_04_1k.hdr'
        ];

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            renderRestaurants('all');
            setupCategoryFilters();
        });

        // Rendu des restaurants style 6avenues
        function renderRestaurants(category) {
            const grid = document.getElementById('restaurantsGrid');
            const filteredDishes = category === 'all' ? dishes : dishes.filter(dish => dish.category === category);
            
            grid.innerHTML = filteredDishes.map(dish => `
                <div class="restaurant-card" onclick="openARModal(${dish.id})">
                    <img src="${dish.image}" alt="${dish.name}" class="restaurant-image">
                    <h3 class="restaurant-name">${dish.name}</h3>
                    <p class="restaurant-description">${dish.description}</p>
                    <p class="restaurant-price">${dish.price}</p>
                    <button class="ar-button">VOIR EN AR</button>
                </div>
            `).join('');
        }

        // Configuration des filtres de catégories
        function setupCategoryFilters() {
            const categoryBtns = document.querySelectorAll('.category-btn');
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    categoryBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    renderRestaurants(this.dataset.category);
                });
            });
        }

        // Ouvrir le modal AR
        function openARModal(dishId) {
            currentDish = dishes.find(dish => dish.id === dishId);
            if (!currentDish) return;

            document.getElementById('modalTitle').textContent = currentDish.name;
            document.getElementById('modalDescription').textContent = currentDish.description;
            document.getElementById('modalPrice').textContent = currentDish.price;

            const modelViewer = document.getElementById('foodModel');
            modelViewer.src = './models/burgertest.glb';
            modelViewer.scale = '0.1 0.1 0.1';
            modelViewer.cameraOrbit = '0deg 75deg 2m';
            modelViewer.environmentImage = environments[0];

            document.getElementById('arModal').style.display = 'block';
        }

        // Fermer le modal AR
        function closeARModal() {
            const modal = document.getElementById('arModal');
            modal.style.display = 'none';
            
            const modelViewer = document.getElementById('foodModel');
            modelViewer.src = '';
        }

        // Reset du modèle
        function resetModel() {
            const modelViewer = document.getElementById('foodModel');
            modelViewer.cameraOrbit = '0deg 75deg 2m';
            modelViewer.scale = '0.1 0.1 0.1';
            showToast('POSITION RÉINITIALISÉE');
        }

        // Toggle rotation
        function toggleRotation() {
            const modelViewer = document.getElementById('foodModel');
            const btn = event.target;
            
            autoRotateEnabled = !autoRotateEnabled;
            modelViewer.autoRotate = autoRotateEnabled;
            btn.textContent = autoRotateEnabled ? 'PAUSE' : 'PLAY';
            
            showToast(autoRotateEnabled ? 'ROTATION ACTIVÉE' : 'ROTATION PAUSÉE');
        }

        // Changer l'environnement
        function changeEnvironment() {
            const modelViewer = document.getElementById('foodModel');
            environmentIndex = (environmentIndex + 1) % environments.length;
            modelViewer.environmentImage = environments[environmentIndex];
            
            const envNames = ['LEVER DE SOLEIL', 'ATELIER', 'FORÊT'];
            showToast(`ÉCLAIRAGE: ${envNames[environmentIndex]}`);
        }

        // Mode table
        function tableMode() {
            const modelViewer = document.getElementById('foodModel');
            modelViewer.cameraOrbit = '0deg 45deg 1.5m';
            modelViewer.setAttribute('shadow-intensity', '3');
            showToast('MODE TABLE ACTIVÉ');
        }

        // Toast notification style 6avenues
        function showToast(message) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                top: 100px;
                left: 50%;
                transform: translateX(-50%) translateY(-50px);
                background-color: rgba(0, 0, 0, 0.9);
                color: #ffffff;
                padding: 1rem 2rem;
                border: 1px solid rgba(255, 255, 255, 0.1);
                font-weight: 500;
                z-index: 10000;
                transition: transform 0.3s ease;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                font-size: 0.85rem;
            `;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.transform = 'translateX(-50%) translateY(0)';
            }, 100);
            
            setTimeout(() => {
                toast.style.transform = 'translateX(-50%) translateY(-50px)';
                setTimeout(() => {
                    if (toast.parentNode) {
                        document.body.removeChild(toast);
                    }
                }, 300);
            }, 2000);
        }

        // Fermer le modal en cliquant à l'extérieur
        window.onclick = function(event) {
            const modal = document.getElementById('arModal');
            if (event.target === modal) {
                closeARModal();
            }
        }
    </script>
</body>
</html>
