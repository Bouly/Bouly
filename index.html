<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6AVENUES - AR Experience</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #FDBD11 0%, #F5A623 100%);
            --secondary-gradient: linear-gradient(135deg, #FDBD11 0%, #FFD700 100%);
            --accent-gradient: linear-gradient(135deg, #FDBD11 0%, #FFC107 100%);
            --dark-gradient: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
            --glass-bg: rgba(0, 0, 0, 0.3);
            --glass-border: rgba(253, 189, 17, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #666666;
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --card-bg: rgba(26, 26, 26, 0.8);
            --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            --hover-shadow: 0 35px 60px -12px rgba(253, 189, 17, 0.3);
            --yellow-primary: #FDBD11;
            --yellow-secondary: #F5A623;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* Header ultra-moderne avec glassmorphism dark */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: slideInLeft 0.8s ease-out;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            height: 70px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            letter-spacing: -0.02em;
            transition: all 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            position: relative;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }

        .nav-links a::before {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--accent-gradient);
            transition: all 0.3s ease;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        .nav-links a:hover::before {
            width: 80%;
        }

        .nav-links a:hover {
            color: var(--yellow-primary);
            background: rgba(253, 189, 17, 0.1);
        }

        /* Main content moderne */
        .main-content {
            margin-top: 70px;
            min-height: 100vh;
        }

        /* Hero Section spectaculaire dark */
        .hero-section {
            text-align: center;
            padding: 8rem 2rem 4rem;
            background: var(--dark-gradient);
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="50" cy="50" r="1" fill="rgba(253,189,17,0.1)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            opacity: 0.3;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            animation: fadeInUp 1s ease-out;
        }

        .hero-title {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            margin-bottom: 1rem;
            letter-spacing: -0.03em;
            color: white;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            line-height: 1.1;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 3rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            background: var(--primary-gradient);
            border: 1px solid var(--yellow-primary);
            padding: 1rem 2rem;
            border-radius: 50px;
            color: var(--bg-primary);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            animation: float 3s ease-in-out infinite;
            box-shadow: 0 10px 30px rgba(253, 189, 17, 0.3);
        }

        .hero-cta:hover {
            background: var(--secondary-gradient);
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(253, 189, 17, 0.5);
        }

        /* Categories ultra-modernes dark */
        .categories-section {
            background: var(--bg-secondary);
            padding: 4rem 2rem;
            position: relative;
        }

        .categories-nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
            max-width: 1000px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .category-btn {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 25px;
            padding: 1rem 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.95rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .category-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--primary-gradient);
            transition: all 0.3s ease;
            z-index: -1;
        }

        .category-btn.active::before,
        .category-btn:hover::before {
            left: 0;
        }

        .category-btn.active,
        .category-btn:hover {
            color: var(--bg-primary);
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(253, 189, 17, 0.4);
            border-color: var(--yellow-primary);
        }

        /* Grid ultra-moderne dark */
        .restaurants-section {
            padding: 4rem 2rem;
            background: var(--bg-primary);
        }

        .restaurants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .restaurant-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 0;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            overflow: hidden;
            border: 1px solid var(--bg-tertiary);
            box-shadow: var(--card-shadow);
            position: relative;
            animation: fadeInUp 0.6s ease-out;
            animation-fill-mode: both;
        }

        .restaurant-card:nth-child(1) { animation-delay: 0.1s; }
        .restaurant-card:nth-child(2) { animation-delay: 0.2s; }
        .restaurant-card:nth-child(3) { animation-delay: 0.3s; }
        .restaurant-card:nth-child(4) { animation-delay: 0.4s; }
        .restaurant-card:nth-child(5) { animation-delay: 0.5s; }
        .restaurant-card:nth-child(6) { animation-delay: 0.6s; }
        .restaurant-card:nth-child(7) { animation-delay: 0.7s; }
        .restaurant-card:nth-child(8) { animation-delay: 0.8s; }

        .restaurant-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--primary-gradient);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .restaurant-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: var(--hover-shadow);
            border-color: var(--yellow-primary);
        }

        .restaurant-card:hover::before {
            opacity: 0.1;
        }

        .restaurant-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 20px 20px 0 0;
            transition: all 0.4s ease;
            position: relative;
            z-index: 2;
        }

        .restaurant-card:hover .restaurant-image {
            transform: scale(1.05);
        }

        .restaurant-content {
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        .restaurant-name {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .restaurant-description {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .restaurant-price {
            font-size: 1.3rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2rem;
        }

        .ar-button {
            background: var(--primary-gradient);
            color: var(--bg-primary);
            border: none;
            padding: 1rem 2rem;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            width: 100%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(253, 189, 17, 0.3);
        }

        .ar-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            transition: all 0.3s ease;
            transform: translate(-50%, -50%);
        }

        .ar-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .ar-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(253, 189, 17, 0.5);
        }

        .ar-button i {
            margin-right: 0.5rem;
        }

        /* Modal ultra-moderne dark */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 2000;
            animation: fadeInUp 0.3s ease-out;
        }

        .modal-content {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            margin: 2% auto;
            padding: 3rem;
            border-radius: 30px;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.4s ease-out;
        }

        .close-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: var(--bg-tertiary);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .close-btn:hover {
            background: var(--yellow-primary);
            color: var(--bg-primary);
            transform: scale(1.1);
            box-shadow: 0 15px 35px rgba(253, 189, 17, 0.4);
        }

        .modal-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .modal-description {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .modal-price {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        model-viewer {
            width: 100%;
            height: 450px;
            margin-bottom: 2rem;
            background: var(--bg-secondary);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .ar-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .control-btn {
            background: var(--bg-tertiary);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
            padding: 1rem 1.5rem;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            font-weight: 600;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .control-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--primary-gradient);
            transition: all 0.3s ease;
            z-index: -1;
        }

        .control-btn:hover::before {
            left: 0;
        }

        .control-btn:hover {
            color: var(--bg-primary);
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(253, 189, 17, 0.4);
        }

        .control-btn i {
            margin-right: 0.5rem;
        }

        /* Footer moderne dark */
        .footer {
            background: var(--dark-gradient);
            padding: 3rem 2rem 2rem;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="footerGrain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="rgba(253,189,17,0.1)"/><circle cx="75" cy="75" r="1" fill="rgba(253,189,17,0.1)"/></pattern></defs><rect width="100" height="100" fill="url(%23footerGrain)"/></svg>');
            opacity: 0.3;
        }

        .footer-content {
            position: relative;
            z-index: 2;
        }

        .footer-text {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 1rem;
        }

        .footer-text a {
            color: var(--yellow-primary);
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 0.2rem 0.5rem;
            border-radius: 5px;
        }

        .footer-text a:hover {
            background: rgba(253, 189, 17, 0.2);
            color: var(--yellow-secondary);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            color: var(--yellow-primary);
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
        }

        .social-link:hover {
            background: var(--yellow-primary);
            color: var(--bg-primary);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(253, 189, 17, 0.4);
        }

        /* Responsive ultra-optimisé */
        @media (max-width: 768px) {
            .hero-title {
                font-size: clamp(2.5rem, 6vw, 4rem);
            }
            
            .hero-subtitle {
                font-size: 1.1rem;
                padding: 0 1rem;
            }
            
            .restaurants-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
                padding: 0 1rem;
            }
            
            .nav-links {
                display: none;
            }
            
            .categories-nav {
                flex-direction: column;
                gap: 0.5rem;
                padding: 0 1rem;
            }
            
            .category-btn {
                width: 100%;
                padding: 1rem;
            }
            
            .ar-controls {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
            
            .modal-content {
                margin: 5% auto;
                padding: 2rem;
                border-radius: 20px;
            }
            
            .modal-title {
                font-size: 2rem;
            }
            
            model-viewer {
                height: 300px;
            }
            
            .hero-section {
                padding: 6rem 1rem 3rem;
            }
            
            .restaurant-card {
                animation-delay: 0.1s !important;
            }
        }

        /* Effets de scroll */
        .scroll-reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }

        .scroll-reveal.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        /* Loading animation dark */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: all 0.5s ease;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(253, 189, 17, 0.3);
            border-top: 3px solid var(--yellow-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading">
        <div class="spinner"></div>
    </div>

    <!-- Header minimaliste -->
    <header class="header">
        <div class="nav-container">
            <a href="#" class="logo">6AVENUES</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="#menu">Menu</a></li>
                    <li><a href="#about">À propos</a></li>
                    <li><a href="#contact">Contact</a></li>
                    <li><a href="https://6avenues.com/" target="_blank">Site Principal</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Hero Section spectaculaire -->
        <section class="hero-section">
            <div class="hero-content">
                <h1 class="hero-title">6AVENUES</h1>
                <p class="hero-subtitle">6 Restaurants - Une seule Adresse<br>Découvrez nos plats en Réalité Augmentée</p>
                <a href="#menu" class="hero-cta">
                    <i class="fas fa-magic"></i>
                    Découvrir en AR
                </a>
            </div>
        </section>

        <!-- Categories Navigation -->
        <section class="categories-section">
            <div class="categories-nav">
                <button class="category-btn active" data-category="all">TOUS</button>
                <button class="category-btn" data-category="burgers">BURGERS</button>
                <button class="category-btn" data-category="pizzas">PIZZAS</button>
                <button class="category-btn" data-category="asiatique">ASIATIQUE</button>
                <button class="category-btn" data-category="sandwichs">SANDWICHS</button>
                <button class="category-btn" data-category="desserts">DESSERTS</button>
            </div>
        </section>

        <!-- Restaurants Section -->
        <section class="restaurants-section" id="menu">
            <div class="restaurants-grid" id="restaurantsGrid">
                <!-- Les restaurants seront générés par JavaScript -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p class="footer-text">© 2024 6AVENUES AR - Annexe de <a href="https://6avenues.com/">6avenues.com</a></p>
            <div class="social-links">
                <a href="https://www.instagram.com/6avenues/" class="social-link" target="_blank">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://6avenues.com/" class="social-link" target="_blank">
                    <i class="fas fa-globe"></i>
                </a>
                <a href="#" class="social-link">
                    <i class="fas fa-phone"></i>
                </a>
            </div>
        </div>
    </footer>

    <!-- Modal AR -->
    <div id="arModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeARModal()">
                <i class="fas fa-times"></i>
            </button>
            <h2 id="modalTitle" class="modal-title">PLAT</h2>
            <p id="modalDescription" class="modal-description">Description</p>
            <p id="modalPrice" class="modal-price">Prix</p>
            
            <model-viewer 
                id="foodModel"
                camera-controls 
                auto-rotate 
                ar 
                ar-scale="auto"
                ar-placement="floor"
                shadow-intensity="1"
                tone-mapping="neutral"
                exposure="1">
            </model-viewer>
            
            <div class="ar-controls">
                <button class="control-btn" onclick="resetModel()">
                    <i class="fas fa-undo"></i>
                    RESET
                </button>
                <button class="control-btn" onclick="toggleRotation()">
                    <i class="fas fa-pause"></i>
                    PAUSE
                </button>
                <button class="control-btn" onclick="changeEnvironment()">
                    <i class="fas fa-lightbulb"></i>
                    ÉCLAIRAGE
                </button>
                <button class="control-btn" onclick="tableMode()">
                    <i class="fas fa-table"></i>
                    TABLE
                </button>
            </div>
        </div>
    </div>

    <script>
        // Configuration des plats de 6avenues avec modèles 3D
        const dishes = [
            {
                id: 1,
                name: "BURGER CLASSIC",
                description: "Pain artisanal, steak de bœuf grillé, salade fraîche, tomate, oignons",
                price: "12.90€",
                category: "burgers",
                image: "https://6avenues.com/wp-content/uploads/2025/03/yankee.png",
                model3d: "./models/burgertest.glb",
                scale: "0.1 0.1 0.1",
                realSize: "12cm x 12cm x 8cm"
            },
            {
                id: 2,
                name: "PIZZA MARGHERITA",
                description: "Sauce tomate artisanale, mozzarella di bufala, basilic frais",
                price: "14.50€",
                category: "pizzas",
                image: "https://6avenues.com/wp-content/uploads/2025/03/yankee.png",
                model3d: "./models/pizza_margherita.gltf",
                scale: "0.08 0.08 0.08",
                realSize: "30cm diamètre x 2cm"
            },
            {
                id: 3,
                name: "BO BUN BŒUF",
                description: "Vermicelles de riz, bœuf grillé, légumes frais, nems, sauce nuoc-mam",
                price: "16.90€",
                category: "asiatique",
                image: "https://6avenues.com/wp-content/uploads/2025/03/yankee.png",
                model3d: "./models/pad_thai.glb",
                scale: "0.12 0.12 0.12",
                realSize: "25cm x 18cm x 5cm"
            },
            {
                id: 4,
                name: "PIZZA RIMINI",
                description: "Sauce tomate, mozzarella, jambon de Parme, roquette, parmesan",
                price: "18.50€",
                category: "pizzas",
                image: "https://6avenues.com/wp-content/uploads/2025/03/yankee.png",
                model3d: "./models/pizza_margherita.gltf",
                scale: "0.08 0.08 0.08",
                realSize: "30cm diamètre x 2cm"
            },
            {
                id: 5,
                name: "PIZZA CHÈVRE MIEL",
                description: "Crème fraîche, mozzarella, fromage de chèvre, miel, noix",
                price: "17.90€",
                category: "pizzas",
                image: "https://6avenues.com/wp-content/uploads/2025/03/yankee.png",
                model3d: "./models/pizza_margherita.gltf",
                scale: "0.08 0.08 0.08",
                realSize: "30cm diamètre x 2cm"
            },
            {
                id: 6,
                name: "SANDWICH MONSIEUR LEE",
                description: "Pain de mie grillé, poulet mariné, crudités, sauce spéciale",
                price: "11.90€",
                category: "sandwichs",
                image: "https://6avenues.com/wp-content/uploads/2025/03/yankee.png",
                model3d: "./models/burgertest.glb",
                scale: "0.1 0.1 0.1",
                realSize: "20cm x 12cm x 8cm"
            },
            {
                id: 7,
                name: "PAD THAÏ CREVETTES",
                description: "Nouilles de riz sautées, crevettes fraîches, légumes croquants, cacahuètes",
                price: "16.90€",
                category: "asiatique",
                image: "https://6avenues.com/wp-content/uploads/2025/03/yankee.png",
                model3d: "./models/pad_thai.glb",
                scale: "0.12 0.12 0.12",
                realSize: "25cm x 18cm x 5cm"
            },
            {
                id: 8,
                name: "TIRAMISU MAISON",
                description: "Mascarpone, café espresso, cacao pur, biscuits cuillère",
                price: "7.50€",
                category: "desserts",
                image: "https://6avenues.com/wp-content/uploads/2025/03/yankee.png",
                model3d: "./models/burgertest.glb",
                scale: "0.08 0.08 0.08",
                realSize: "12cm x 8cm x 6cm"
            }
        ];

        let currentDish = null;
        let autoRotateEnabled = true;
        let environmentIndex = 0;

        const environments = [
            'https://modelviewer.dev/shared-assets/environments/spruit_sunrise_1k_HDR.hdr',
            'https://modelviewer.dev/shared-assets/environments/aircraft_workshop_01_1k.hdr',
            'https://modelviewer.dev/shared-assets/environments/whipple_creek_regional_park_04_1k.hdr'
        ];

        document.addEventListener('DOMContentLoaded', function() {
            renderRestaurants('all');
            setupCategoryFilters();
        });

        function renderRestaurants(category) {
            const grid = document.getElementById('restaurantsGrid');
            const filteredDishes = category === 'all' ? dishes : dishes.filter(dish => dish.category === category);
            
            grid.innerHTML = filteredDishes.map((dish, index) => `
                <div class="restaurant-card scroll-reveal" onclick="openARModal(${dish.id})" style="animation-delay: ${index * 0.1}s">
                    <img src="${dish.image}" alt="${dish.name}" class="restaurant-image" loading="lazy">
                    <div class="restaurant-content">
                        <h3 class="restaurant-name">${dish.name}</h3>
                        <p class="restaurant-description">${dish.description}</p>
                        <p class="restaurant-price">${dish.price}</p>
                        <button class="ar-button">
                            <i class="fas fa-eye"></i>
                            VOIR EN AR
                        </button>
                    </div>
                </div>
            `).join('');
            
            // Trigger scroll reveal animation
            setTimeout(() => {
                document.querySelectorAll('.scroll-reveal').forEach((el, index) => {
                    setTimeout(() => {
                        el.classList.add('revealed');
                    }, index * 100);
                });
            }, 100);
        }

        function setupCategoryFilters() {
            const categoryBtns = document.querySelectorAll('.category-btn');
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    categoryBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    renderRestaurants(this.dataset.category);
                });
            });
        }

        function openARModal(dishId) {
            currentDish = dishes.find(dish => dish.id === dishId);
            if (!currentDish) return;

            document.getElementById('modalTitle').textContent = currentDish.name;
            document.getElementById('modalDescription').textContent = currentDish.description;
            document.getElementById('modalPrice').textContent = currentDish.price;

            const modelViewer = document.getElementById('foodModel');
            // Utilise le modèle spécifique ou le burger par défaut
            modelViewer.src = currentDish.model3d || './models/burgertest.glb';
            modelViewer.scale = currentDish.scale || '0.1 0.1 0.1';
            modelViewer.cameraOrbit = '0deg 75deg 2m';
            modelViewer.environmentImage = environments[0];

            // Affiche la taille réelle si disponible
            if (currentDish.realSize) {
                const sizeInfo = document.createElement('p');
                sizeInfo.textContent = `Taille réelle : ${currentDish.realSize}`;
                sizeInfo.style.color = '#666666';
                sizeInfo.style.fontSize = '0.8rem';
                sizeInfo.style.marginBottom = '1rem';
                sizeInfo.id = 'realSizeInfo';
                
                // Supprime l'ancienne info si elle existe
                const oldInfo = document.getElementById('realSizeInfo');
                if (oldInfo) oldInfo.remove();
                
                // Ajoute après la description
                document.getElementById('modalPrice').parentNode.insertBefore(sizeInfo, document.getElementById('modalPrice'));
            }

            document.getElementById('arModal').style.display = 'block';
        }

        function closeARModal() {
            document.getElementById('arModal').style.display = 'none';
            document.getElementById('foodModel').src = '';
        }

        function resetModel() {
            const modelViewer = document.getElementById('foodModel');
            modelViewer.cameraOrbit = '0deg 75deg 2m';
            modelViewer.scale = '0.1 0.1 0.1';
        }

        function toggleRotation() {
            const modelViewer = document.getElementById('foodModel');
            const btn = event.target.closest('.control-btn');
            const icon = btn.querySelector('i');
            autoRotateEnabled = !autoRotateEnabled;
            modelViewer.autoRotate = autoRotateEnabled;
            
            if (autoRotateEnabled) {
                btn.innerHTML = '<i class="fas fa-pause"></i> PAUSE';
            } else {
                btn.innerHTML = '<i class="fas fa-play"></i> PLAY';
            }
        }

        // Smooth scrolling for navigation
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Add loading screen
        window.addEventListener('load', function() {
            setTimeout(() => {
                const loading = document.querySelector('.loading');
                if (loading) {
                    loading.classList.add('hidden');
                    setTimeout(() => loading.remove(), 500);
                }
            }, 1000);
        });

        // Intersection Observer for scroll animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('revealed');
                }
            });
        }, observerOptions);

        function changeEnvironment() {
            const modelViewer = document.getElementById('foodModel');
            environmentIndex = (environmentIndex + 1) % environments.length;
            modelViewer.environmentImage = environments[environmentIndex];
        }

        function tableMode() {
            const modelViewer = document.getElementById('foodModel');
            modelViewer.cameraOrbit = '0deg 45deg 1.5m';
            modelViewer.setAttribute('shadow-intensity', '2');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('arModal');
            if (event.target === modal) {
                closeARModal();
            }
        }
    </script>
</body>
</html>
