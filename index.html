<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - 6AVENUES Restaurant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&family=Gettalk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        /* === POLICES PERSONNALISEES === */
        @font-face {
            font-family: 'gettalk';
            src: url('./fonts/Gettalk.otf') format('opentype');
        }
        
        @font-face {
            font-family: 'Kenyan Coffee';
            src: url('./fonts/Kenyan Coffee Rg.otf') format('opentype');
        }

        /* === VARIABLES GLOBALES PROFESSIONNELLES === */
        :root {
            /* Couleurs inspirées des grandes chaînes */
            --primary-red: #FDBD11;
            --primary-yellow: #FDBD11;
            --secondary-red: #FDBD11;
            --dark-text: #292929;        /* Texte foncé professionnel */
            --light-text: #666666;       /* Texte secondaire */
            --white: #FFFFFF;
            --light-gray: #F8F8F8;       /* Arrière-plan clean */
            --border-gray: #E1E1E1;      /* Bordures subtiles */
            --success-green: #00B74A;    /* Vert Subway */
            
            /* Typographie professionnelle */
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-weight-regular: 400;
            --font-weight-medium: 500;
            --font-weight-semibold: 600;
            --font-weight-bold: 700;
            --font-weight-black: 900;
            
            /* Espacements cohérents */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-2xl: 48px;
            --space-3xl: 64px;
            
            /* Rayons de bordure */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            
            /* Ombres professionnelles */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px rgba(0, 0, 0, 0.15);
            
            /* Transitions */
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
            --transition-slow: 0.35s ease;
        }

        /* === RESET ET BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            font-weight: var(--font-weight-regular);
            line-height: 1.6;
            color: #f3f3f3;
            background: #FFDDAC;
            overflow-x: hidden;
            cursor: auto;
        }

        /* === HEADER PROFESSIONNEL === */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #232526;
            border-bottom: 1px solid #222;
            z-index: 1000;
            transition: var(--transition-normal);
        }

        .header.scrolled {
            box-shadow: var(--shadow-md);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--space-lg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .logo img {
            height: 40px;
            width: auto;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: var(--space-xl);
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #f3f3f3;
            font-weight: var(--font-weight-medium);
            font-size: 15px;
            transition: var(--transition-fast);
            position: relative;
        }

        .nav-links a:hover {
            color: #FFA726;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-red);
            transition: var(--transition-fast);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* === LAYOUT PRINCIPAL === */
        .main-content {
            margin-top: 70px;
        }

        /* === HERO SECTION MENU === */
        .menu-hero {
            background: radial-gradient(at center center, #ffd79c 10%, #f79321 70%, #5E070F 100%);
            padding: var(--space-3xl) 0 var(--space-3xl) 0;
            text-align: center;
            position: relative;
            overflow: hidden;
            min-height: 85vh;
            display: none;
            align-items: center;
        }

        .menu-hero-content {
            max-width: 900px;
            margin: 0 auto;
            padding: var(--space-3xl) var(--space-lg);
            position: relative;
            z-index: 2;
        }

        .menu-title {
            position: relative;
            margin-bottom: var(--space-xl);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-sm);
        }

        .menu-main-text {
            font-family: 'gettalk';
            font-size: clamp(40px, 8vw, 80px);
            font-weight: normal;
            color: #ffddac;
            text-shadow: 4px 4px 8px rgba(94, 7, 15, 0.8);
            letter-spacing: -3px;
            position: relative;
            z-index: 2;
        }

        .menu-sub-text {
            font-family: 'Kenyan Coffee';
            font-size: clamp(30px, 5vw, 60px);
            font-weight: bold;
            color: #5E070F;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(255, 221, 172, 0.8);
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
            margin-top: -10px;
        }

        .menu-subtitle {
            font-size: 18px;
            color: #ffddac;
            margin-bottom: var(--space-xl);
            line-height: 1.6;
            font-weight: var(--font-weight-medium);
            text-shadow: 2px 2px 4px rgba(94, 7, 15, 0.7);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* === CATEGORIES NAVIGATION === */
        .categories-section {
            background: linear-gradient(135deg, rgba(24,24,24,0.85) 0%, rgba(35,37,38,0.85) 100%), url('./img/menu.jpg') center center/cover no-repeat;
            padding: var(--space-2xl) 0;
            border-bottom: 1px solid var(--border-gray);
        }

        .categories-nav {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--space-xl);
            max-width: 1600px;
            margin: 0 auto;
            padding: var(--space-2xl);
        }

        .categories-nav::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            position: relative;
            background: var(--white);
            border: 2px solid var(--border-gray);
            border-radius: var(--radius-xl);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 0;
            font-family: inherit;
            box-shadow: var(--shadow-md);
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
        }

        .category-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, 
                transparent 0%, 
                rgba(0, 0, 0, 0.4) 40%, 
                rgba(13, 13, 13, 0.9) 100%);
            z-index: 2;
            transition: var(--transition-normal);
        }

        .category-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--primary-red) 0%, var(--primary-yellow) 100%);
            opacity: 0;
            transition: var(--transition-normal);
            z-index: 1;
        }

        .category-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition-slow);
            z-index: 1;
            filter: brightness(1.1) contrast(1.2) saturate(1.3);
        }

        .category-label {
            position: relative;
            z-index: 3;
            color: var(--white);
            font-weight: var(--font-weight-black);
            font-size: 16px;
            text-align: center;
            padding: var(--space-lg);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.8);
            transition: var(--transition-normal);
        }

        .category-btn:hover {
            transform: translateY(-8px) scale(1.05);
            border-color: var(--primary-red);
            box-shadow: var(--shadow-xl), 0 0 30px rgba(214, 35, 0, 0.3);
        }

        .category-btn:hover::after {
            opacity: 0.2;
        }

        .category-btn:hover .category-image {
            transform: scale(1.15);
            filter: brightness(1.3) contrast(1.3) saturate(1.5);
        }

        .category-btn:hover .category-label {
            color: var(--primary-yellow);
            text-shadow: 0 0 20px rgba(255, 199, 44, 0.9);
        }

        .category-btn.active {
            border-color: var(--primary-red);
            box-shadow: 0 0 60px #FDBD11, 0 0 30px rgba(253,189,17,0.25);
            transform: translateY(-12px) scale(1.08);
            animation: glowCat 1.2s infinite alternate;
        }

        @keyframes glowCat {
            0% { box-shadow: 0 0 60px #FDBD11, 0 0 30px rgba(253,189,17,0.25); }
            100% { box-shadow: 0 0 80px #FDBD11, 0 0 50px rgba(253,189,17,0.35); }
        }

        .category-btn.active::after {
            opacity: 0.25;
        }

        .category-btn.active .category-label {
            color: var(--primary-yellow);
            text-shadow: 0 0 25px rgba(255, 199, 44, 1);
        }

        .category-btn.active .category-image {
            transform: scale(1.2);
            filter: brightness(1.4) contrast(1.4) saturate(1.6);
        }

        .category-btn:active {
            transform: translateY(-4px) scale(1.02);
        }

        /* === CARD SIMPLE UNICOLORE === */
        .simple-burger-card {
            background: radial-gradient(at center center, #ffd79c 36%, #f79321 80%);
            border-radius: 45px;
            width: 380px;
            height: 420px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin: 30px auto;
            transition: background 0.3s, border 0.3s, border-radius 0.3s, box-shadow 0.3s;
        }

        .simple-burger-card .PG-product-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .simple-burger-card .PG-product-info {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            padding-top: 180px;
            transition: left 0.3s ease-in-out;
            z-index: 2;
        }

        .simple-burger-card:hover .PG-product-info {
            left: 0;
        }

        /* Position the titles at the top */
        .simple-burger-title {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            z-index: 1;
            text-align: center;
            margin-bottom: 0;
            display: block;
            height: 80px;
        }

        .burger-text {
            width: 100%;
            font-family: gettalk;
            font-size: 60px;
            font-weight: normal;
            text-align: center;
            position: absolute;
            top: 0;
            left: 0;
            margin-bottom: 0;
            color: #ffddac;
            z-index: 2;
        }

        .chili-text {
            width: 100%;
            font-family: 'Kenyan Coffee';
            font-size: 80px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            text-decoration: solid;
            margin-bottom: 0;
            color: #5e070f;
            position: relative;
            z-index: 1;
        }

        /* Position the image at the bottom */
        .simple-burger-img {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            object-fit: contain;
            width: 120%;
            max-width: 400px;
            height: auto;
            border-radius: 15px;
        }

        .PG-product-description {
            margin-top: 10%;
            margin-bottom: 5%;
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            color: #5E070F;
            font-weight: 500;
            line-height: 1.4;
            padding: 0 20px;
        }

        .PG-product-ingredients {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100px; /* Ajuste la hauteur selon le rendu souhaité */
            font-weight: 800;
            color: #5E070F;
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            padding: 0 20px;
            margin: 0 auto;
        }

        /* === GRID DES RESTAURANTS STYLE CRISPY === */
        .restaurants-section {
            background: #FFDDAC;
            padding: var(--space-3xl) 0;
        }

        .restaurants-grid {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 var(--space-lg);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: var(--space-2xl);
            justify-items: center;
        }

        /* === MODAL AR PROFESSIONNEL === */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--white);
            margin: var(--space-lg);
            padding: var(--space-xl);
            border-radius: var(--radius-xl);
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: var(--shadow-xl);
        }

        .close-btn {
            position: absolute;
            top: var(--space-md);
            right: var(--space-md);
            background: var(--light-gray);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
        }

        .close-btn:hover {
            background: var(--border-gray);
        }

        .modal-title {
            font-size: 28px;
            font-weight: var(--font-weight-black);
            color: var(--dark-text);
            margin-bottom: var(--space-md);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-description {
            font-size: 16px;
            color: var(--light-text);
            margin-bottom: var(--space-lg);
            line-height: 1.6;
        }

        .modal-price {
            font-size: 32px;
            font-weight: var(--font-weight-black);
            color: var(--primary-red);
            margin-bottom: var(--space-xl);
        }

        model-viewer {
            width: 100%;
            height: 400px;
            background-color: var(--light-gray);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-lg);
        }

        .ar-controls {
            display: flex;
            gap: var(--space-md);
            justify-content: center;
            flex-wrap: wrap;
        }

        .control-btn {
            background: var(--light-gray);
            border: 1px solid var(--border-gray);
            padding: var(--space-md) var(--space-lg);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: var(--transition-fast);
            font-weight: var(--font-weight-medium);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .control-btn:hover {
            background: var(--border-gray);
        }

        .control-btn.primary {
            background: var(--primary-red);
            color: var(--white);
            border-color: var(--primary-red);
        }

        .control-btn.primary:hover {
            background: #B01F00;
        }

        /* === FOOTER CLEAN === */
        .footer {
            background: var(--dark-text);
            color: var(--white);
            padding: var(--space-xl) 0;
            text-align: center;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--space-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-lg);
        }

        .footer-text {
            font-size: 14px;
            color: #CCCCCC;
        }

        .footer-text a {
            color: var(--primary-yellow);
            text-decoration: none;
        }

        .social-links {
            display: flex;
            gap: var(--space-md);
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: var(--light-text);
            color: var(--white);
            border-radius: 50%;
            text-decoration: none;
            transition: var(--transition-fast);
        }

        .social-link:hover {
            background: var(--primary-red);
            transform: translateY(-2px);
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            
            .menu-title {
                font-size: 36px;
            }
            
            .menu-subtitle {
                font-size: 16px;
            }
            
            .categories-nav {
                padding: 0 var(--space-md);
            }
            
            .restaurants-grid {
                grid-template-columns: 1fr;
                padding: 0 var(--space-md);
            }
            
            .footer-content {
                flex-direction: column;
                text-align: center;
            }
        }

        /* === ANIMATIONS === */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .scroll-reveal {
            opacity: 0;
            transform: translateY(30px) scale(0.98);
            transition: all 0.6s cubic-bezier(0.4,0.2,0.2,1);
        }

        .scroll-reveal.revealed {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Loading Screen */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: all 0.5s ease;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 3px solid var(--border-gray);
            border-top: 3px solid var(--primary-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Back to Home Button */
        .back-home-btn {
            background: radial-gradient(at center center, #ffd79c 36%, #f79321 80%);
            color: #5E070F;
            padding: var(--space-md) var(--space-xl);
            border-radius: 45px;
            text-decoration: none;
            font-weight: var(--font-weight-black);
            font-size: 16px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none;
            align-items: center;
            gap: var(--space-md);
            box-shadow: 0 8px 32px rgba(247, 147, 33, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 3px solid #ffddac;
            cursor: pointer;
            position: fixed;
            top: 20px;
            left: var(--space-xl);
            z-index: 1100;
        }

        .back-home-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 12px 40px rgba(247, 147, 33, 0.6);
        }

        /* Bouton AR stylé */
        .ar-btn {
            margin-top: 10px;
            background: rgba(94, 7, 15, 0.9);
            color: #FFDDAC;
            border: 2px solid #FFDDAC;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 221, 172, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .ar-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 221, 172, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .ar-btn:hover {
            background: rgba(94, 7, 15, 1);
            border-color: #FDBD11;
            color: #FDBD11;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25), 0 0 20px rgba(253, 189, 17, 0.3);
        }
        
        .ar-btn:hover::before {
            left: 100%;
        }
        
        .ar-btn:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading">
        <div class="spinner"></div>
    </div>

    <!-- Back to Home Button -->
    <a href="index.html" class="back-home-btn">
        <i class="fas fa-arrow-left"></i>
        <span>Retour Accueil</span>
    </a>

    <!-- Header -->
    <header class="header">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="./img/6avenues-logo-1.png" alt="6AVENUES" />
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="#menu">Notre Menu</a></li>
                    <li><a href="index.html#about">À propos</a></li>
                    <li><a href="index.html#contact">Contact</a></li>

    <!-- Main Content -->
    <main class="main-content">

        <section class="menu-hero">

                    <span class="menu-main-text">NOTRE</span>

                    Découvrez tous nos plats délicieux<br>
                    <strong>En Réalité Augmentée</strong>

        </section>

        <!-- Categories Navigation -->
        <section class="categories-section">
            <div class="categories-nav">
                <button class="category-btn active" data-category="all">
                    <img src="./img/6th-avenues-Yankee-menu.jpg" alt="Tous" class="category-image">
                    <span class="category-label">Tous nos plats</span>
                </button>
                <button class="category-btn" data-category="burgers">
                    <img src="./img/6th-avenues-Yankee-menu.jpg" alt="Burgers" class="category-image">
                    <span class="category-label">Burgers</span>
                </button>
                <button class="category-btn" data-category="pizzas">
                    <img src="./img/6th-avenues-FRATELLI-menu.jpg" alt="Pizzas" class="category-image">
                    <span class="category-label">Pizzas</span>
                </button>
                <button class="category-btn" data-category="asiatique">
                    <img src="./img/6th-avenues-Asia-menu.jpg" alt="Asiatique" class="category-image">

                <button class="category-btn" data-category="sandwichs">
                    <img src="./img/6th-avenues-los-pollos-menu.jpg" alt="Sandwichs" class="category-image">
                    <span class="category-label">Sandwichs</span>
                </button>
                <button class="category-btn" data-category="desserts">
                    <img src="./img/6th-avenues-CANDY-Bar-menu.jpg" alt="Desserts" class="category-image">
                    <span class="category-label">Desserts</span>
                </button>
            </div>
        </section>

        <!-- Menu Section -->
        <section class="restaurants-section" id="menu">
            <div class="restaurants-grid" id="restaurantsGrid">
                <!-- Les cartes seront générées par JavaScript -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p class="footer-text">© 2024 6AVENUES - Annexe de <a href="https://6avenues.com/">6avenues.com</a></p>
            <div class="social-links">
                <a href="https://www.instagram.com/6avenues/" class="social-link" target="_blank">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://6avenues.com/" class="social-link" target="_blank">
                    <i class="fas fa-globe"></i>
                </a>
                <a href="#" class="social-link">
                    <i class="fas fa-phone"></i>
                </a>
            </div>
        </div>
    </footer>

    <!-- Modal AR -->
    <div id="arModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeARModal()">
                <i class="fas fa-times"></i>
            </button>
            <h2 id="modalTitle" class="modal-title">PLAT</h2>
            <p id="modalDescription" class="modal-description">Description</p>
            <p id="modalPrice" class="modal-price">Prix</p>
            
            <model-viewer 
                id="foodModel"
                camera-controls 
                auto-rotate 
                ar 
                ar-scale="auto"
                ar-placement="floor"
                shadow-intensity="1"
                tone-mapping="neutral"
                exposure="1">
            </model-viewer>
            
            <div class="ar-controls">
                <button class="control-btn primary" onclick="startARGame()">
                    <i class="fas fa-gamepad"></i>
                    Mini-jeu AR
                </button>
            </div>
        </div>
    </div>

    <script>
        // Configuration des plats
        const dishes = [
            {
                id: 1,
                name: "Burger Classic",
                description: "Pain artisanal, steak de bœuf grillé, salade fraîche, tomate, oignons",
                price: "12.90€",
                category: "burgers",
                image: "./img/burger-300x233.png",
                model3d: "./models/burgertest2.glb",
                scale: "0.1 0.1 0.1",
                badge: "BESTSELLER",
                badgeColor: "#E53935"
            },
            {
                id: 2,
                name: "Pizza Margherita",
                description: "Sauce tomate artisanale, mozzarella di bufala, basilic frais",
                price: "14.50€",
                category: "pizzas",
                image: "./img/burger-300x233.png",
                model3d: "./models/burgertest.glb",
                scale: "0.08 0.08 0.08",
                badge: "POPULAIRE",
                badgeColor: "#FF8F00"
            },
            {
                id: 3,
                name: "Bo Bun",
                description: "Vermicelles de riz, bœuf grillé, légumes frais, nems, sauce nuoc-mam",
                price: "16.90€",
                category: "asiatique",
                image: "./img/burger-300x233.png",
                model3d: "./models/burgertest.glb",
                scale: "0.12 0.12 0.12"
            },
            {
                id: 4,
                name: "Pizza Rimini",
                description: "Sauce tomate, mozzarella, jambon de Parme, roquette, parmesan",
                price: "18.50€",
                category: "pizzas",
                image: "./img/burger-300x233.png",
                model3d: "./models/burgertest.glb",
                scale: "0.08 0.08 0.08"
            },
            {
                id: 5,
                name: "Pizza Chèvre",
                description: "Crème fraîche, mozzarella, fromage de chèvre, miel, noix",
                price: "17.90€",
                category: "pizzas",
                image: "./img/burger-300x233.png",
                model3d: "./models/burgertest.glb",
                scale: "0.08 0.08 0.08",
                badge: "NOUVEAU",
                badgeColor: "#4CAF50"
            },
            {
                id: 6,
                name: "Sandwich Lee",
                description: "Pain de mie grillé, poulet mariné, crudités, sauce spéciale",
                price: "11.90€",
                category: "sandwichs",
                image: "./img/burger-300x233.png",
                model3d: "./models/burgertest.glb",
                scale: "0.1 0.1 0.1"
            },
            {
                id: 7,
                name: "Pad Thaï",
                description: "Nouilles de riz sautées, crevettes fraîches, légumes croquants, cacahuètes",
                price: "16.90€",
                category: "asiatique",
                image: "./img/burger-300x233.png",
                model3d: "./models/burgertest.glb",
                scale: "0.12 0.12 0.12",
                badge: "BESTSELLER",
                badgeColor: "#E53935"
            },
            {
                id: 8,
                name: "Tiramisu Maison",
                description: "Mascarpone, café espresso, cacao pur, biscuits cuillère",
                price: "7.50€",
                category: "desserts",
                image: "./img/burger-300x233.png",
                model3d: "./models/burgertest.glb",
                scale: "0.08 0.08 0.08"
            }
        ];

        let currentDish = null;

        document.addEventListener('DOMContentLoaded', function() {
            renderRestaurants('all');
            setupCategoryFilters();
            
            // Header scroll effect (retardé pour accès au bouton)
            window.addEventListener('scroll', () => {
                const header = document.querySelector('.header');
                if (window.scrollY > 400) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });
            
            // Loading screen
            setTimeout(() => {
                const loading = document.querySelector('.loading');
                if (loading) {
                    loading.classList.add('hidden');
                }
            }, 1000);
        });

        function renderRestaurants(category) {
            const grid = document.getElementById('restaurantsGrid');
            const filteredDishes = category === 'all' ? dishes : dishes.filter(dish => dish.category === category);
            
            grid.innerHTML = filteredDishes.map((dish, index) => {
                // Séparer le nom du plat en deux parties pour l'affichage
                const nameParts = dish.name.split(' ');
                const firstWord = nameParts[0];
                const restOfName = nameParts.slice(1).join(' ');
                
                return `
                <div class="simple-burger-card scroll-reveal" style="animation-delay: ${index * 0.1}s">
                    <div class="PG-product-content">
                        <div class="simple-burger-title">
                            <div class="burger-text">${firstWord}</div>
                            <div class="chili-text">${restOfName}</div>
                        </div>
                        <img src="${dish.image}" alt="${dish.name}" class="simple-burger-img">
                    </div>
                    <div class="PG-product-info">
                        <div class="simple-burger-title">
                            <div class="burger-text">${firstWord}</div>
                            <div class="chili-text">${restOfName}</div>
                        </div>
                        <div class="PG-product-ingredients">Prix: ${dish.price}</div>
                        <div class="PG-product-description">${dish.description}</div>
                        <button class="ar-btn" onclick="openARModal(${dish.id})">Voir en AR</button>
                    </div>
                </div>
            `;
            }).join('');
            
            // Trigger scroll reveal animation
            setTimeout(() => {
                const reveals = document.querySelectorAll('.scroll-reveal');
                reveals.forEach(reveal => reveal.classList.add('revealed'));
            }, 100);
        }

        function setupCategoryFilters() {
            const categoryBtns = document.querySelectorAll('.category-btn');
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Remove active class from all buttons
                    categoryBtns.forEach(b => b.classList.remove('active'));
                    // Add active class to clicked button
                    btn.classList.add('active');
                    // Filter restaurants
                    const category = btn.dataset.category;
                    renderRestaurants(category);
                });
            });
        }

        function openARModal(dishId) {
            currentDish = dishes.find(dish => dish.id === dishId);
            if (!currentDish) return;

            document.getElementById('modalTitle').textContent = currentDish.name;
            document.getElementById('modalDescription').textContent = currentDish.description;
            document.getElementById('modalPrice').textContent = currentDish.price;

            const modelViewer = document.getElementById('foodModel');
            modelViewer.src = currentDish.model3d || './models/burgertest2.glb';
            modelViewer.scale = currentDish.scale || '0.1 0.1 0.1';

            document.getElementById('arModal').classList.add('active');
        }

        function closeARModal() {
            document.getElementById('arModal').classList.remove('active');
            document.getElementById('foodModel').src = '';
        }

        function startARGame() {
            alert('Mini-jeu AR bientôt disponible !');
        }
    </script>
</body>
</html>
