<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOD COURT</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            color: #000000;
            line-height: 1.4;
        }

        /* Header minimaliste comme 6avenues */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            border-bottom: 1px solid #e0e0e0;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            height: 60px;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 600;
            color: #000000;
            text-decoration: none;
            letter-spacing: 0.1em;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: #000000;
            text-decoration: none;
            font-weight: 400;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #666666;
        }

        /* Main content exact comme 6avenues */
        .main-content {
            margin-top: 60px;
            min-height: 100vh;
        }

        .hero-section {
            text-align: center;
            padding: 4rem 2rem 2rem;
            background-color: #ffffff;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
            color: #000000;
        }

        .hero-subtitle {
            font-size: 1rem;
            font-weight: 400;
            color: #666666;
            margin-bottom: 2rem;
        }

        /* Categories comme leur navigation */
        .categories-section {
            background-color: #ffffff;
            padding: 2rem;
            border-bottom: 1px solid #e0e0e0;
        }

        .categories-nav {
            display: flex;
            justify-content: center;
            gap: 0;
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid #e0e0e0;
        }

        .category-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-right: 1px solid #e0e0e0;
            padding: 1rem 2rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .category-btn:last-child {
            border-right: none;
        }

        .category-btn.active,
        .category-btn:hover {
            background-color: #f5f5f5;
        }

        /* Grid restaurants exact comme 6avenues */
        .restaurants-section {
            padding: 0;
            background-color: #ffffff;
        }

        .restaurants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 0;
            max-width: 1200px;
            margin: 0 auto;
            border-left: 1px solid #e0e0e0;
            border-right: 1px solid #e0e0e0;
        }

        .restaurant-card {
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            border-right: 1px solid #e0e0e0;
            padding: 2rem;
            text-align: center;
            transition: background-color 0.2s ease;
            cursor: pointer;
        }

        .restaurant-card:nth-child(even) {
            border-right: none;
        }

        .restaurant-card:hover {
            background-color: #f9f9f9;
        }

        .restaurant-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            margin-bottom: 1.5rem;
        }

        .restaurant-name {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #000000;
        }

        .restaurant-description {
            font-size: 0.9rem;
            color: #666666;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .restaurant-price {
            font-size: 1.1rem;
            font-weight: 600;
            color: #000000;
            margin-bottom: 1.5rem;
        }

        .ar-button {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 0.8rem 2rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-size: 0.9rem;
        }

        .ar-button:hover {
            background-color: #333333;
        }

        /* Modal style minimaliste */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            z-index: 2000;
            backdrop-filter: blur(20px);
        }

        .modal-content {
            position: relative;
            background-color: #ffffff;
            margin: 3% auto;
            padding: 3rem;
            border: 1px solid #e0e0e0;
            max-width: 800px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #ffffff;
            color: #000000;
            border: 1px solid #e0e0e0;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background-color 0.2s ease;
        }

        .close-btn:hover {
            background-color: #f5f5f5;
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #000000;
        }

        .modal-description {
            color: #666666;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .modal-price {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 2rem;
            color: #000000;
        }

        model-viewer {
            width: 100%;
            height: 400px;
            margin-bottom: 2rem;
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
        }

        .ar-controls {
            display: flex;
            gap: 0;
            justify-content: center;
            border: 1px solid #e0e0e0;
        }

        .control-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-right: 1px solid #e0e0e0;
            padding: 1rem 1.5rem;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background-color 0.2s ease;
            font-weight: 500;
        }

        .control-btn:last-child {
            border-right: none;
        }

        .control-btn:hover {
            background-color: #f5f5f5;
        }

        /* Footer minimaliste */
        .footer {
            border-top: 1px solid #e0e0e0;
            padding: 2rem;
            text-align: center;
            background-color: #ffffff;
            margin-top: 4rem;
        }

        .footer-text {
            color: #666666;
            font-size: 0.8rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }
            
            .restaurants-grid {
                grid-template-columns: 1fr;
                border-left: none;
                border-right: none;
            }
            
            .restaurant-card:nth-child(even) {
                border-right: 1px solid #e0e0e0;
            }
            
            .nav-links {
                display: none;
            }
            
            .categories-nav {
                flex-direction: column;
            }
            
            .category-btn {
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
            }
            
            .category-btn:last-child {
                border-bottom: none;
            }
            
            .ar-controls {
                flex-direction: column;
            }
            
            .control-btn {
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
            }
            
            .control-btn:last-child {
                border-bottom: none;
            }
        }
    </style>
</head>
<body>
    <!-- Header minimaliste -->
    <header class="header">
        <div class="nav-container">
            <a href="#" class="logo">FOOD COURT</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="#menu">Menu</a></li>
                    <li><a href="#about">À propos</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Hero Section simple -->
        <section class="hero-section">
            <h1 class="hero-title">FOOD COURT</h1>
            <p class="hero-subtitle">6 Restaurants - Une seule Adresse<br>Découvrez nos plats en Réalité Augmentée</p>
        </section>

        <!-- Categories Navigation -->
        <section class="categories-section">
            <div class="categories-nav">
                <button class="category-btn active" data-category="all">TOUS</button>
                <button class="category-btn" data-category="burgers">BURGERS</button>
                <button class="category-btn" data-category="pizzas">PIZZAS</button>
                <button class="category-btn" data-category="asiatique">ASIATIQUE</button>
                <button class="category-btn" data-category="desserts">DESSERTS</button>
            </div>
        </section>

        <!-- Restaurants Section -->
        <section class="restaurants-section">
            <div class="restaurants-grid" id="restaurantsGrid">
                <!-- Les restaurants seront générés par JavaScript -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p class="footer-text">© 2024 FOOD COURT AR</p>
    </footer>

    <!-- Modal AR -->
    <div id="arModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeARModal()">&times;</button>
            <h2 id="modalTitle" class="modal-title">PLAT</h2>
            <p id="modalDescription" class="modal-description">Description</p>
            <p id="modalPrice" class="modal-price">Prix</p>
            
            <model-viewer 
                id="foodModel"
                camera-controls 
                auto-rotate 
                ar 
                ar-scale="auto"
                ar-placement="floor"
                shadow-intensity="1"
                tone-mapping="neutral"
                exposure="1">
            </model-viewer>
            
            <div class="ar-controls">
                <button class="control-btn" onclick="resetModel()">RESET</button>
                <button class="control-btn" onclick="toggleRotation()">PAUSE</button>
                <button class="control-btn" onclick="changeEnvironment()">ÉCLAIRAGE</button>
                <button class="control-btn" onclick="tableMode()">MODE TABLE</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration des plats
        const dishes = [
            {
                id: 1,
                name: "BURGER CLASSIC",
                description: "Pain artisanal, steak de bœuf grillé, salade fraîche, tomate, oignons",
                price: "12.90€",
                category: "burgers",
                image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&h=300&fit=crop&auto=format&q=80"
            },
            {
                id: 2,
                name: "PIZZA MARGHERITA",
                description: "Sauce tomate artisanale, mozzarella di bufala, basilic frais",
                price: "14.50€",
                category: "pizzas",
                image: "https://images.unsplash.com/photo-1565299624946-b28f40a0ca4b?w=500&h=300&fit=crop&auto=format&q=80"
            },
            {
                id: 3,
                name: "PAD THAÏ CREVETTES",
                description: "Nouilles de riz sautées, crevettes fraîches, légumes croquants",
                price: "16.90€",
                category: "asiatique",
                image: "https://images.unsplash.com/photo-1559314809-0f31657def5e?w=500&h=300&fit=crop&auto=format&q=80"
            },
            {
                id: 4,
                name: "BURGER VÉGÉTARIEN",
                description: "Steak végétal maison, avocat, roquette, tomate, sauce vegan",
                price: "13.50€",
                category: "burgers",
                image: "https://images.unsplash.com/photo-1525059696034-4967a729002e?w=500&h=300&fit=crop&auto=format&q=80"
            },
            {
                id: 5,
                name: "PIZZA 4 FROMAGES",
                description: "Mozzarella, gorgonzola AOP, parmesan 24 mois, chèvre",
                price: "16.90€",
                category: "pizzas",
                image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500&h=300&fit=crop&auto=format&q=80"
            },
            {
                id: 6,
                name: "BO BUN BŒUF",
                description: "Vermicelles de riz, bœuf grillé, légumes frais, nems",
                price: "15.90€",
                category: "asiatique",
                image: "https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=500&h=300&fit=crop&auto=format&q=80"
            },
            {
                id: 7,
                name: "TIRAMISU MAISON",
                description: "Mascarpone, café espresso, cacao pur, biscuits cuillère",
                price: "7.50€",
                category: "desserts",
                image: "https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=500&h=300&fit=crop&auto=format&q=80"
            },
            {
                id: 8,
                name: "BURGER BBQ",
                description: "Pain brioche, steak premium, bacon, oignons caramélisés",
                price: "15.90€",
                category: "burgers",
                image: "https://images.unsplash.com/photo-1553979459-d2229ba7433a?w=500&h=300&fit=crop&auto=format&q=80"
            }
        ];

        let currentDish = null;
        let autoRotateEnabled = true;
        let environmentIndex = 0;

        const environments = [
            'https://modelviewer.dev/shared-assets/environments/spruit_sunrise_1k_HDR.hdr',
            'https://modelviewer.dev/shared-assets/environments/aircraft_workshop_01_1k.hdr',
            'https://modelviewer.dev/shared-assets/environments/whipple_creek_regional_park_04_1k.hdr'
        ];

        document.addEventListener('DOMContentLoaded', function() {
            renderRestaurants('all');
            setupCategoryFilters();
        });

        function renderRestaurants(category) {
            const grid = document.getElementById('restaurantsGrid');
            const filteredDishes = category === 'all' ? dishes : dishes.filter(dish => dish.category === category);
            
            grid.innerHTML = filteredDishes.map(dish => `
                <div class="restaurant-card" onclick="openARModal(${dish.id})">
                    <img src="${dish.image}" alt="${dish.name}" class="restaurant-image">
                    <h3 class="restaurant-name">${dish.name}</h3>
                    <p class="restaurant-description">${dish.description}</p>
                    <p class="restaurant-price">${dish.price}</p>
                    <button class="ar-button">VOIR EN AR</button>
                </div>
            `).join('');
        }

        function setupCategoryFilters() {
            const categoryBtns = document.querySelectorAll('.category-btn');
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    categoryBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    renderRestaurants(this.dataset.category);
                });
            });
        }

        function openARModal(dishId) {
            currentDish = dishes.find(dish => dish.id === dishId);
            if (!currentDish) return;

            document.getElementById('modalTitle').textContent = currentDish.name;
            document.getElementById('modalDescription').textContent = currentDish.description;
            document.getElementById('modalPrice').textContent = currentDish.price;

            const modelViewer = document.getElementById('foodModel');
            modelViewer.src = './models/burgertest.glb';
            modelViewer.scale = '0.1 0.1 0.1';
            modelViewer.cameraOrbit = '0deg 75deg 2m';
            modelViewer.environmentImage = environments[0];

            document.getElementById('arModal').style.display = 'block';
        }

        function closeARModal() {
            document.getElementById('arModal').style.display = 'none';
            document.getElementById('foodModel').src = '';
        }

        function resetModel() {
            const modelViewer = document.getElementById('foodModel');
            modelViewer.cameraOrbit = '0deg 75deg 2m';
            modelViewer.scale = '0.1 0.1 0.1';
        }

        function toggleRotation() {
            const modelViewer = document.getElementById('foodModel');
            const btn = event.target;
            autoRotateEnabled = !autoRotateEnabled;
            modelViewer.autoRotate = autoRotateEnabled;
            btn.textContent = autoRotateEnabled ? 'PAUSE' : 'PLAY';
        }

        function changeEnvironment() {
            const modelViewer = document.getElementById('foodModel');
            environmentIndex = (environmentIndex + 1) % environments.length;
            modelViewer.environmentImage = environments[environmentIndex];
        }

        function tableMode() {
            const modelViewer = document.getElementById('foodModel');
            modelViewer.cameraOrbit = '0deg 45deg 1.5m';
            modelViewer.setAttribute('shadow-intensity', '2');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('arModal');
            if (event.target === modal) {
                closeARModal();
            }
        }
    </script>
</body>
</html>
